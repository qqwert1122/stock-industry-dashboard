interpretation:
  defaults:
    polarity: neutral
  rules:
    # Source: FRED Sahm Rule release, 0.50pp start-of-recession signal.
    # https://fred.stlouisfed.org/release?rid=456
    - match: { history_key: fred-SAHMREALTIME, name: Sahm Rule 침체 지표 }
      thresholds:
        - at_or_above: 0.5
          zone: bad
          label: 침체 신호
          text: "Sahm Rule이 침체 판정 기준 0.5 이상입니다. 기준 0.5 대비 침체가 이미 시작됐을 확률이 높다는 신호입니다."
        - below: 0.5
          zone: neutral
          label: 기준 아래
          text: "Sahm Rule이 침체 판정 기준 0.5 미만입니다. 기준 0.5 대비 아직 안전 구간입니다."

    # Source: New York Fed yield curve model uses the 10Y-3M term spread for 12-month recession probability.
    # https://www.newyorkfed.org/research/capital_markets/ycfaq
    - match: { history_key: fred-T10Y3M, name: 미국 10Y-3M 금리차 }
      thresholds:
        - below: 0
          zone: bad
          label: 수익률곡선 역전
          text: "10Y-3M 금리차가 역전 기준 0 아래입니다. 기준 0 대비 수익률곡선 역전은 역사적으로 1~2년 내 침체를 선행한 경우가 많았습니다."
        - at_or_above: 0
          zone: neutral
          label: 역전 아님
          text: "10Y-3M 금리차가 역전 기준 0 이상입니다. 기준 0 대비 수익률곡선은 아직 정상 구간입니다."

    # Source: FRED Treasury spread series; 0 is the curve-inversion boundary.
    # https://fred.stlouisfed.org/series/T10Y2Y
    - match: { history_key: fred-T10Y2Y, name: 미국 10Y-2Y 금리차 }
      thresholds:
        - below: 0
          zone: bad
          label: 수익률곡선 역전
          text: "10Y-2Y 금리차가 역전 기준 0 아래입니다. 기준 0 대비 수익률곡선 역전은 역사적으로 1~2년 내 침체를 선행한 경우가 많았습니다."
        - at_or_above: 0
          zone: neutral
          label: 역전 아님
          text: "10Y-2Y 금리차가 역전 기준 0 이상입니다. 기준 0 대비 수익률곡선은 아직 정상 구간입니다."

    # Source: Cboe VIX, widely used as the equity-market fear/volatility gauge; 30/40 are dashboard risk bands.
    # https://www.cboe.com/tradable-products/vix/
    - match: { name: VIX }
      thresholds:
        - at_or_above: 40
          zone: bad
          label: 패닉 구간
          text: "VIX가 패닉 기준 40 이상입니다. 기준 40 대비 시장 공포가 극단적으로 커진 구간이며, 장기투자자에게는 분할매수 검토 구간이었던 경우가 많았습니다."
        - at_or_above: 30
          zone: watch
          label: 공포 구간
          text: "VIX가 공포 기준 30 이상입니다. 기준 30 대비 변동성 부담과 위험회피 심리가 커진 구간입니다."
        - below: 20
          zone: good
          label: 안정 구간
          text: "VIX가 안정 기준 20 미만입니다. 기준 20 대비 시장 변동성 기대가 낮은 구간입니다."
        - default: true
          zone: neutral
          label: 중립 구간
          text: "VIX가 안정 기준 20과 공포 기준 30 사이입니다. 기준 20/30 대비 시장 불안은 중립 구간입니다."

    # Source: FRED ICE BofA US High Yield OAS; 3%p/5%p are dashboard credit-risk bands.
    # https://fred.stlouisfed.org/series/BAMLH0A0HYM2
    - match: { history_key: fred-BAMLH0A0HYM2, name: 미국 하이일드 회사채 OAS }
      thresholds:
        - at_or_above: 5
          zone: bad
          label: 신용경색 우려
          text: "하이일드 OAS가 신용경색 경계 기준 5%p 이상입니다. 기준 5%p 대비 부도위험과 자금조달 스트레스가 커진 구간입니다."
        - at_or_below: 3
          zone: watch
          label: 낙관 과열
          text: "하이일드 OAS가 위험선호 과열 기준 3%p 이하입니다. 기준 3%p 대비 신용시장이 지나치게 낙관적인 구간일 수 있습니다."
        - default: true
          zone: neutral
          label: 중립 구간
          text: "하이일드 OAS가 3%p와 5%p 사이입니다. 기준 3%p/5%p 대비 신용위험은 중립 구간입니다."

    # Source: KRX valuation data; 0.9/1.3 are long-run Korea-market valuation bands used by this dashboard.
    # https://data.krx.co.kr/
    - match: { name: 코스피 PBR }
      thresholds:
        - below: 0.9
          zone: good
          label: 역사적 저평가
          text: "코스피 PBR이 역사적 저평가 기준 0.9 미만입니다. 기준 0.9 대비 자산가치보다 싸게 거래되는 구간입니다."
        - above_strict: 1.3
          zone: bad
          label: 역사적 고평가
          text: "코스피 PBR이 역사적 고평가 기준 1.3 초과입니다. 기준 1.3 대비 밸류에이션 부담이 커진 구간입니다."
        - default: true
          zone: neutral
          label: 중립 구간
          text: "코스피 PBR이 저평가 기준 0.9와 고평가 기준 1.3 사이입니다. 기준 0.9/1.3 대비 중립 구간입니다."

    # Source: FRED DEXKOUS spot exchange rate; 1400/1500 are dashboard KRW stress bands.
    # https://fred.stlouisfed.org/series/DEXKOUS
    - match: { name: 원/달러 환율 }
      thresholds:
        - at_or_above: 1500
          zone: bad
          label: 위기 수준
          text: "원/달러 환율이 위기 기준 1500원 이상입니다. 기준 1500원 대비 원화 약세와 달러 유동성 부담이 큰 구간입니다."
        - at_or_above: 1400
          zone: watch
          label: 경계 구간
          text: "원/달러 환율이 경계 기준 1400원 이상입니다. 기준 1400원 대비 수입물가와 외국인 수급 부담을 점검할 구간입니다."

    # Source: internal Upbit/BTC-USD spread calculation; ±3%/±7% are dashboard crypto-sentiment bands.
    - match: { name: 김치프리미엄 }
      thresholds:
        - at_or_above: 7
          zone: bad
          label: 투기 과열
          text: "김치프리미엄이 국내 투기 과열 기준 7% 이상입니다. 기준 7% 대비 국내 크립토 위험선호가 과도하게 커진 구간입니다."
        - at_or_above: 3
          zone: watch
          label: 과열 조짐
          text: "김치프리미엄이 과열 조짐 기준 3% 이상입니다. 기준 3% 대비 국내 위험선호가 빠르게 강해진 구간입니다."
        - at_or_below: -3
          zone: cold
          label: 위험선호 위축
          text: "김치프리미엄이 위험선호 위축 기준 -3% 이하입니다. 기준 -3% 대비 국내 크립토 수요가 약한 구간입니다."

    # Source: Bank of Korea ECOS CCSI/BSI diffusion indexes; 100 separates optimism from pessimism.
    # https://ecos.bok.or.kr/
    - match: { name: 한국 소비자심리지수(CCSI) }
      thresholds:
        - at_or_above: 100
          zone: good
          label: 낙관 우위
          text: "CCSI가 심리 기준선 100 이상입니다. 기준 100 대비 소비자 낙관 응답이 우세한 구간입니다."
        - below: 100
          zone: watch
          label: 비관 우위
          text: "CCSI가 심리 기준선 100 미만입니다. 기준 100 대비 소비자 비관 응답이 우세한 구간입니다."
    - match: { name: 한국 전산업 업황실적 BSI }
      thresholds:
        - at_or_above: 100
          zone: good
          label: 업황 낙관
          text: "BSI가 업황 기준선 100 이상입니다. 기준 100 대비 기업들의 긍정 응답이 우세한 구간입니다."
        - below: 100
          zone: watch
          label: 업황 비관
          text: "BSI가 업황 기준선 100 미만입니다. 기준 100 대비 기업들의 부정 응답이 우세한 구간입니다."
    - match: { name: 한국 경기선행지수 순환변동치 }
      thresholds:
        - at_or_above: 100
          zone: good
          label: 경기 확장 쪽
          text: "경기선행지수 순환변동치가 기준선 100 이상입니다. 기준 100 대비 경기 순환이 확장 쪽에 있는 구간입니다."
        - below: 100
          zone: watch
          label: 경기 둔화 쪽
          text: "경기선행지수 순환변동치가 기준선 100 미만입니다. 기준 100 대비 경기 순환이 둔화 쪽에 있는 구간입니다."

    # Source: Robert Shiller/Multpl CAPE history begins in 1871; keep percentile interpretation, not fixed thresholds.
    # https://www.multpl.com/shiller-pe
    - match: { name: S&P 500 Shiller CAPE }
      polarity: lower_is_better
      percentile_basis: "1871년 이후"
      percentile_zone_labels:
        hot: 역사적 극단 고평가
        warm: 역사적 고평가
        neutral: 역사적 중간 구간
        cool: 역사적 저평가
        cold: 역사적 극단 저평가

    # Source: dashboard calculation from FRED WALCL/RRPONTSYD and Treasury FiscalData TGA.
    # No absolute valuation threshold is used; higher net liquidity is generally friendlier to risk assets.
    - match: { history_key: us-net-liquidity, name: 미국 순유동성 }
      polarity: higher_is_better
      template: us_liquidity_trend

dashboard:
  title: 산업별 핵심 지표 대시보드
  history_points: 48
  industries:
    - 반도체
    - 데이터인프라
    - 자동차
    - 전기차
    - 조선
    - 철강/소재
    - 화학/정유
    - 은행/금융
    - 건설/부동산
    - 방산
    - 스테이블코인
    - 전력
    - 로봇
    - 우주
    - 바이오
    - 배터리
    - 매크로
  fred_series:
    - id: DGS10
      name: 미국 10년 국채금리
      industry: 은행/금융
      unit: "%"
      frequency: 일간
    - id: DGS2
      name: 미국 2년 국채금리
      industry: 은행/금융
      unit: "%"
      frequency: 일간
    - id: T10Y2Y
      name: 미국 10Y-2Y 금리차
      industry: 은행/금융
      unit: "%"
      frequency: 일간
    - id: BAA10Y
      name: 미국 BAA 회사채-10년 국채 스프레드
      industry: 은행/금융
      unit: "%"
      frequency: 일간
      group: 신용 스프레드
    - id: BAMLC0A0CM
      name: 미국 투자등급 회사채 OAS
      industry: 은행/금융
      unit: "%"
      frequency: 일간
      group: 신용 스프레드
      meaning: 미국 투자등급 회사채 OAS는 우량 회사채 신용위험과 자금조달 여건을 보여주는 지표입니다.
    - id: BAMLC0A4CBBB
      name: 미국 BBB 회사채 OAS
      industry: 은행/금융
      unit: "%"
      frequency: 일간
      group: 신용 스프레드
      meaning: BBB 회사채 OAS는 경기 둔화와 신용위험 확대에 민감한 투자등급 하단 스프레드입니다.
    - id: BAMLH0A0HYM2
      name: 미국 하이일드 회사채 OAS
      industry: 은행/금융
      unit: "%"
