# 텔레그램 알림 (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 시크릿 필요)
# 임계값을 새로 돌파했을 때 1회 발송하고, 다시 벗어났다 재돌파하면 재발송합니다.
alerts:
  enabled: true
  state_file: data/alerts_state.json
  signal_log_file: data/signal_log.json
  weekly_digest: true  # 월요일 실행 시 주간 다이제스트 발송
  rules:
    - metric: 하이일드 회사채 OAS
      above: 5.0
      message: 신용시장 스트레스 구간입니다. 위험자산 비중을 점검하세요.
    - metric: Sahm Rule
      above: 0.5
      message: 침체 시작 가능성이 높다는 신호입니다.
    - metric: 10Y-3M 금리차
      below: 0
      message: 수익률곡선 역전. 역사적으로 1~2년 내 침체가 잦았습니다.
    - metric: VIX
      above: 40
      message: 공포 구간입니다. 장기투자자에게는 분할 매수 검토 구간이었던 경우가 많습니다.
    - metric: 코스피 PBR
      below: 0.9
      message: 코스피가 역사적 저평가 구간에 들어왔습니다.
    - metric: 코스피 PBR
      above: 1.3
      message: 코스피 밸류에이션이 역사적 고평가 구간입니다.
    - metric: S&P 500 Shiller CAPE
      pct_above: 95
      message: 미국 증시 밸류에이션이 극단 구간입니다.
    - metric: 원/달러 환율
      above: 1500
      message: 환율이 위기 수준입니다. 달러 자산/환헤지 상황을 점검하세요.

