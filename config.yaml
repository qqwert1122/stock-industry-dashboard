timezone: Asia/Seoul
report:
  title: 아침 매크로 리포트

# 장기 히스토리 축적 설정. data/history 밑 JSON이 repo에 커밋되어
# 최초 백필 이후에는 증분 요청만으로 전체 기간 시계열이 유지됩니다.
history:
  enabled: true
  dir: data/history
  display_points: 60        # 카드 소형 차트에 표시할 최근 포인트 수
  long_history_max_points: 480  # 상세 차트용 다운샘플링 상한

market_sentiment:
  enabled: true
  cnn:
    enabled: true
    backfill_start: 2021-02-01
    source_url: https://www.cnn.com/markets/fear-and-greed
  korea:
    enabled: true
    source_url: https://openapi.krx.co.kr/
    krx_api_base: https://data-dbg.krx.co.kr/svc/apis
    lookback_calendar_days: 430
    keep_calendar_days: 430
    max_backfill_days_per_run: 8
    high_low_window_days: 370
    min_high_low_points: 120

market_overview:
  enabled: true
  flows:
    enabled: true
    krx_getjson_endpoint: https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd
    lookback_calendar_days: 760
    keep_calendar_days: 760
    max_backfill_days_per_run: 3

calendar:
  enabled: true
  dir: data/calendar

