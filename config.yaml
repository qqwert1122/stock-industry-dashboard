      source_url: https://www.iea.org/data-and-statistics/data-tools/global-ev-data-explorer
      frequency: 연간/비정기
      status: partial
      note: 무료 공개 데이터는 있으나 월간 자동 API는 제한적입니다.
    - industry: 자동차/전기차
      name: 리튬/배터리 원재료 가격
      source: World Bank Pink Sheet
      source_url: https://www.worldbank.org/en/research/commodity-markets
      frequency: 월간
      status: partial
      note: 공개 엑셀 다운로드를 붙이면 일부 원자재는 자동화 가능합니다.
    - industry: 자동차/전기차
      name: 주요 완성차 월별 판매
      source: 각 완성차 IR/판매 보도자료
      source_url: https://global.toyota/en/ir/library/sales-production/
      frequency: 월간
      status: partial
      note: 회사별 포맷이 달라 우선순위 업체부터 개별 파서가 필요합니다.
    - industry: 조선
      name: BDI
      source: Baltic Exchange 공개 페이지
      source_url: https://www.balticexchange.com/en/data-services/market-information0.html
      frequency: 일간
      status: manual
      note: 안정적인 무료 공식 API가 없어 수동 입력 또는 라이선스 데이터가 현실적입니다.
    - industry: 조선
      name: 신조선가/LNG선 발주량 대체 지표
      source: 조선사 공시/수출 HS 8901
      source_url: https://dart.fss.or.kr/
      frequency: 월간/비정기
      status: partial
      note: Clarksons 지표는 유료 성격이 강해 공시와 수출 데이터를 대체 지표로 씁니다.
    - industry: 조선
      name: 해운 운임지수
      source: 상하이항운거래소 공개 지수
      source_url: https://en.sse.net.cn/indices/scfinew.jsp
      frequency: 주간
      status: partial
      note: 공개 페이지 기반이라 포맷 변경 리스크가 있습니다.
    - industry: 철강/소재
      name: 중국 산업생산/제조업 PMI
      source: 중국 국가통계국/공식 PMI
      source_url: https://www.stats.gov.cn/english/
      frequency: 월간
      status: partial
      note: 공식 발표는 무료이나 API보다 공시 페이지/파일 파싱에 가깝습니다.
    - industry: 화학/정유
      name: 나프타/올레핀 스프레드
      source: EIA/World Bank/공개 원자재 데이터
      source_url: https://www.eia.gov/opendata/
      frequency: 주간/월간
      status: partial
      note: 제품 가격 무료 시계열이 제한적이라 유가와 화학 PPI를 대체 지표로 사용합니다.
    - industry: 화학/정유
      name: 정제마진 대체 지표
      source: EIA petroleum product prices
      source_url: https://www.eia.gov/opendata/
      frequency: 주간
      status: partial
      note: 제품별 가격 API를 붙여 3-2-1 crack spread 형태로 확장 가능합니다.
    - industry: 건설/부동산
      name: 한국 미분양/주택가격지수
      source: 국토교통부/KOSIS/한국부동산원
      source_url: https://kosis.kr/
      frequency: 월간
      status: partial
      note: 국내 통계 API 키와 지표 코드를 확정하면 자동화 가능합니다.
    - industry: 방산
      name: 한국 방산 수출 수주
      source: 방위사업청/기업 공시
      source_url: https://www.dapa.go.kr/
      frequency: 비정기
      status: partial
      note: 방산 수주는 계약 공시와 정부 발표의 비정형성이 커서 우선 공시/보도자료 파서 후보로 둡니다.
    - industry: 스테이블코인
      name: USDT/USDC 준비금과 발행량
      source: Tether/Circle 투명성 페이지
      source_url: https://www.circle.com/transparency
      frequency: 일간/월간
      status: partial
      note: DefiLlama 유통량은 자동 수집하고, 발행사 준비금 구성은 별도 공시 파서 후보입니다.
    - industry: 전력
      name: 전력 수요/예비율
      source: 전력거래소 전력통계정보시스템
      source_url: https://epsis.kpx.or.kr/
      frequency: 일간/월간
      status: partial
      note: 국내 전력 수요와 예비율은 공개 통계가 있으나 API/파일 포맷 확인 후 파서가 필요합니다.
    - industry: 로봇
      name: 산업용 로봇 설치 대수
      source: International Federation of Robotics
      source_url: https://ifr.org/
      frequency: 연간
      status: manual
      note: 핵심 통계는 연간 리포트 중심이라 무료 자동화 범위가 제한적입니다.
    - industry: 우주
      name: 위성 발사/수주 이벤트
      source: Space-Track/NASA/기업 공시
      source_url: https://www.space-track.org/
      frequency: 비정기
      status: partial
      note: 발사 이벤트는 공개 API가 가능하지만 투자지표화하려면 기업별 수주/매출 매핑이 필요합니다.
    - industry: 바이오
      name: FDA 신약 승인/임상 이벤트
      source: FDA Drugs@FDA
      source_url: https://www.accessdata.fda.gov/scripts/cder/daf/
      frequency: 비정기
      status: partial
      note: 승인 이벤트는 자동화 가능하지만 기업/파이프라인 매핑 로직이 추가로 필요합니다.
    - industry: 배터리
      name: 리튬/니켈/코발트 가격
      source: World Bank Pink Sheet/공개 원자재 데이터
      source_url: https://www.worldbank.org/en/research/commodity-markets
      frequency: 월간
      status: partial
      note: 원자재 공개 엑셀을 붙이면 배터리 소재 가격 proxy를 자동화할 수 있습니다.

