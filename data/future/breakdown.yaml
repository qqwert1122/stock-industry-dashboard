      name: 자율주행 단계
      name_en: Driving automation level
      ladder: sae-autonomy
      required_rung: L4
      current_rung: L4
      what: 기사 없이 돈을 받고 승객을 태우려면 최소 L4처럼 정해진 지역에서는 사람이 운전하지 않아도 되는 수준이 필요합니다.
      what_en: Paid driverless passenger service needs at least L4, where no human driving is needed inside a defined operating area.
      gap: Waymo는 일부 도시에서 이미 L4 유료 운행을 하고 있습니다. 다만 지역을 넓히는 속도가 핵심입니다.
