    - id: vehicle-cost
      name: 차량 원가
      name_en: Vehicle cost
      target_label: 무인 택시 수익성이 나오는 차량·센서·정비 원가
      target_label_en: Vehicle, sensor, and maintenance cost low enough for driverless taxi margins
      current_label: 초기 전용 차량과 센서 비용은 아직 지역별 수익성 검증 단계
      current_label_en: Dedicated vehicles and sensor stacks still need city-by-city margin proof
      what: 로보택시는 운전자가 없어도 차량 가격, 센서, 원격관제, 정비비가 높으면 요금 인하 효과가 작아집니다.
      what_en: Robotaxis need low vehicle, sensor, remote-ops, and maintenance cost, otherwise removing the driver does not lower fares enough.
      gap: 원가는 회사별 공개가 제한적이라 실제 대당 경제성은 아직 낮은 확신으로 봅니다.
      gap_en: Per-vehicle economics are still low-confidence because companies disclose limited cost detail.
      pursuing:
