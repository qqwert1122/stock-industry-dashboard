      what_en: Scaling vehicles together with remote assistance, cleaning, and maintenance matters more than success in one city.
      gap: 새 도시마다 지도·차고지·정비·현지 허가를 다시 구축해야 하는 문제가 남아 있습니다.
      gap_en: Each new city still requires mapping, depots, maintenance, and local approvals.
      pursuing: [Waymo, Baidu Apollo Go, Zoox]
      metric: 유료 운행 도시·주간 탑승·차량 가동률
      metric_en: Paid-service cities, weekly trips, and fleet utilization
