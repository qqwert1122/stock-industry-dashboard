      source_label_en: Waymo service expansion plan
      gap_score: 3

    - id: supervised-fsd-gap
      name: 운전자 감독 제거
      name_en: Removing driver supervision
      ladder: sae-autonomy
      required_rung: L4
      current_rung: L2
      what: 대중형 로보택시가 되려면 운전자가 계속 감시하는 기능이 아니라 차가 책임지고 운행하는 기능이어야 합니다.
      what_en: A mass-market robotaxi needs the vehicle to take responsibility, not a feature that still requires driver supervision.
      gap: Tesla FSD는 현재 운전자 감독이 필요한 기능으로 안내되고 있어 무인 유료 운행과는 단계 차이가 큽니다.
      gap_en: Tesla FSD is still described as requiring active driver supervision, so it remains far from paid driverless operation.
      pursuing:
        - { label: Tesla, label_en: Tesla, symbol: TSLA }
