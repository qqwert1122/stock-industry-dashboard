      name_en: Safety evidence
      target_label: 인간 운전과 비교 가능한 주행거리 대비 사고률을 여러 도시에서 재현
      target_label_en: Reproduce human-comparable crash rates per mile across multiple cities
      current_label: 일부 운영사의 안전 결과와 정부 사고 보고는 축적 중이나 비교 기준은 아직 불완전
      current_label_en: Operator studies and government crash reports are accumulating, but comparison baselines remain incomplete
      what: 로보택시는 데모가 아니라 실제 운행거리와 사고 심각도로 안전성을 입증해야 합니다.
      what_en: Robotaxi safety must be demonstrated with real operating miles and crash severity, not demonstrations.
      gap: NHTSA 자료는 보고 범위와 운행 노출량이 회사별로 달라 단순 사고 건수 비교를 피해야 합니다.
