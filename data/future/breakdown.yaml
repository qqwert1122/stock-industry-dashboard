      current_label_en: Concentrated in selected regions such as Phoenix, San Francisco, LA, and Austin
      what: 기술이 가능해도 사고 책임, 보험료, 운행 허가가 열리지 않으면 서비스가 빠르게 늘기 어렵습니다.
