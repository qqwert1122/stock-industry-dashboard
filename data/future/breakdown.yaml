        - { label: Tesla, label_en: Tesla, symbol: TSLA }
        - { label: Zoox, label_en: Zoox }
      metric: 대당 센서·차량 원가와 차량 가동률
      metric_en: Sensor and vehicle cost per unit plus utilization
