      pursuing:
        - { label: Tesla, label_en: Tesla, symbol: TSLA }
        - { label: Zoox, label_en: Zoox }
        - { label: Mobileye, label_en: Mobileye, symbol: MBLY }
      metric: 유료 로보택시 운행 도시와 주간 탑승 건수
      metric_en: Paid robotaxi operating cities and weekly trips
      confidence: high
      as_of: 2026-07-10
      source: https://waymo.com/blog/2025/05/scaling-our-fleet-through-us-manufacturing/
      source_label: Waymo 주간 유료 운행 규모
      source_label_en: Waymo weekly paid trip scale
      gap_score: 0

