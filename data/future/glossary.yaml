- id: trl
  term: TRL(기술성숙도)
  term_en: TRL (Technology Readiness Level)
  short: 기술이 아이디어(1)에서 일상 제품(9)까지 어디쯤 와 있는지 보여주는 9단계 눈금입니다.
  short_en: A 9-step scale that shows whether a technology is still an idea, in testing, or ready for everyday use.
  source: https://www.nasa.gov/directorates/somd/space-communications-navigation-program/technology-readiness-levels/
  learn_more: https://www.nasa.gov/directorates/somd/space-communications-navigation-program/technology-readiness-levels/

- id: agi
  term: AGI
  term_en: AGI
  short: 한 가지 일만 잘하는 AI가 아니라, 사람처럼 여러 문제를 배워서 풀 수 있는 범용 인공지능입니다.
  short_en: General AI that can learn and solve many kinds of problems, instead of doing only one narrow task.
  source: https://www.ibm.com/think/topics/artificial-general-intelligence
  learn_more: https://www.ibm.com/think/topics/artificial-general-intelligence

- id: l4
  term: L4 자율주행
  term_en: Level 4 autonomous driving
  short: 정해진 지역과 조건에서는 운전자가 개입하지 않아도 차가 스스로 달릴 수 있는 단계입니다.
  short_en: A stage where a vehicle can drive itself without a human driver inside defined areas and conditions.
  source: https://www.sae.org/blog/sae-j3016-update
  learn_more: https://www.sae.org/blog/sae-j3016-update

- id: fusion
  term: 핵융합
  term_en: Fusion energy
  short: 태양처럼 가벼운 원자핵을 합쳐 에너지를 얻는 방식입니다. 아직 상업 발전까지는 검증이 더 필요합니다.
  short_en: A way to make energy by joining light atomic nuclei, like the Sun. Commercial power still needs more proof.
  source: https://www.energy.gov/science/doe-explainsnuclear-fusion-reactions
  learn_more: https://www.energy.gov/science/doe-explainsnuclear-fusion-reactions

- id: longevity
  term: 수명 탈출 속도
  term_en: Longevity escape velocity
  short: 의학 발전이 노화 속도보다 빨라져 기대수명이 계속 늘어날 수 있다는 생각입니다.
  short_en: The idea that medical progress could extend life expectancy faster than aging takes it away.
  source: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6777448/
  learn_more: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6777448/

- id: singularity
  term: 특이점
  term_en: Singularity
  short: AI가 더 강한 AI를 빠르게 만들며 기술 변화 속도가 사람이 따라가기 어려울 만큼 빨라진다는 예측입니다.
  short_en: A prediction that AI will help create stronger AI, making technological change accelerate very quickly.
  source: https://www.penguinrandomhouse.com/books/529669/the-singularity-is-nearer-by-ray-kurzweil/
  learn_more: https://www.penguinrandomhouse.com/books/529669/the-singularity-is-nearer-by-ray-kurzweil/

- id: qubit
  term: 큐비트
  term_en: Qubit
  short: 양자 컴퓨터의 정보 단위로, 0과 1의 상태를 겹쳐 표현할 수 있습니다.
  short_en: The unit of quantum information, able to represent overlapping states of zero and one.
  source: https://www.ibm.com/think/topics/qubit
  learn_more: https://www.ibm.com/think/topics/qubit

- id: logical-qubit
  term: 논리 큐비트
  term_en: Logical qubit
  short: 여러 물리 큐비트를 묶어 오류를 찾아 고치도록 만든 더 안정적인 계산 단위입니다.
  short_en: A more stable computing unit built from multiple physical qubits so errors can be detected and corrected.
  source: https://www.ibm.com/roadmaps/quantum/2030/
  learn_more: https://www.ibm.com/roadmaps/quantum/2030/

- id: post-quantum-cryptography
  term: 양자내성암호
  term_en: Post-quantum cryptography
  short: 강한 양자 컴퓨터가 등장해도 풀기 어렵도록 설계한 새로운 암호 방식입니다.
  short_en: New cryptographic methods designed to resist attacks from powerful quantum computers.
  source: https://www.nist.gov/pqcrypto
  learn_more: https://www.nist.gov/pqcrypto

- id: invasive-electrode
  term: 침습형 전극
  term_en: Invasive electrode
  short: 더 선명한 뇌 신호를 읽기 위해 수술로 뇌 표면이나 조직 안에 넣는 전극입니다.
  short_en: An electrode surgically placed on or in brain tissue to record clearer neural signals.
  source: https://www.fda.gov/regulatory-information/search-fda-guidance-documents/implanted-brain-computer-interface-bci-devices-patients-paralysis-or-amputation-non-clinical-testing
  learn_more: https://www.fda.gov/regulatory-information/search-fda-guidance-documents/implanted-brain-computer-interface-bci-devices-patients-paralysis-or-amputation-non-clinical-testing

- id: evtol
  term: eVTOL
  term_en: eVTOL
  short: 전기로 수직 이착륙해 짧은 도심 노선을 비행하도록 설계한 항공기입니다.
  short_en: An electric aircraft designed to take off and land vertically for short urban routes.
  source: https://www.faa.gov/air-taxis
  learn_more: https://www.faa.gov/air-taxis

- id: type-certification
  term: 형식인증
  term_en: Type certification
  short: 항공기 설계가 정해진 안전 기준을 충족한다고 항공 당국이 승인하는 절차입니다.
  short_en: Regulatory approval that an aircraft design meets applicable safety standards.
  source: https://www.faa.gov/aircraft/air_cert/design_approvals/type_certificate
  learn_more: https://www.faa.gov/aircraft/air_cert/design_approvals/type_certificate

- id: dac
  term: DAC
  term_en: Direct Air Capture
  short: 주변 공기에서 이산화탄소를 직접 분리해 저장하거나 활용하는 기술입니다.
  short_en: Technology that separates carbon dioxide directly from ambient air for storage or use.
  source: https://www.energy.gov/science/doe-explainsdirect-air-capture
  learn_more: https://www.energy.gov/science/doe-explainsdirect-air-capture

- id: sai
  term: SAI(성층권 에어로졸 주입)
  term_en: SAI (Stratospheric Aerosol Injection)
  short: 성층권에 반사 입자를 넣어 햇빛 일부를 우주로 돌려보내려는 지구공학 구상입니다.
  short_en: A geoengineering proposal to place reflective particles in the stratosphere and reflect some sunlight.
  source: https://www.unep.org/resources/report/Solar-Radiation-Modification-research-deployment
  learn_more: https://www.unep.org/resources/report/Solar-Radiation-Modification-research-deployment

- id: precision-fermentation
  term: 정밀발효
  term_en: Precision fermentation
  short: 미생물에 설계 정보를 넣어 우유·계란 단백질 같은 특정 성분을 만들게 하는 방식입니다.
  short_en: A method that programs microbes to produce specific ingredients such as dairy or egg proteins.
  source: https://www.fda.gov/food/food-ingredients-packaging
  learn_more: https://www.fda.gov/food/food-ingredients-packaging
