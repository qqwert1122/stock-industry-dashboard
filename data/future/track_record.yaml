  predicted_for: 2005년 말
  predicted_for_en: End of 2005
  predicted_for_year: 2005
  actual_year: 2003
  actual_label: 2003년 4월 인간 게놈 프로젝트 완료 발표
  actual_label_en: Completion of the Human Genome Project announced in April 2003
  status: on_time
  what: 사람의 유전 정보를 읽어 기준 서열을 만들겠다는 국제 과학 프로젝트였습니다.
  what_en: An international project to read human genetic information and produce a reference sequence.
  outcome: 원래 일정인 2005년보다 2년 반가량 빨리 완료됐습니다.
  outcome_en: It finished about two and a half years ahead of the original 2005 schedule.
  lesson: 측정 비용이 빠르게 떨어지는 분야는 대형 프로젝트가 예상보다 빨라질 수 있습니다.
  lesson_en: When measurement costs fall quickly, large projects can finish earlier than expected.
  source: https://www.genome.gov/11006929/2003-release-international-consortium-completes-hgp
  source_label: NHGRI 인간 게놈 프로젝트 완료 발표
