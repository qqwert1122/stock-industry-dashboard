  lesson: 이미 가격 하락과 소형화가 진행 중인 하드웨어 흐름은 비교적 예측하기 쉽습니다.
  lesson_en: Hardware trends already moving toward lower cost and smaller size are comparatively predictable.
  source: https://www.thekurzweillibrary.com/images/How-My-Predictions-Are-Faring.pdf
