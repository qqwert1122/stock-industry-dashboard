- id: moonshot-kennedy
  name: 달 착륙
  name_en: Moon Landing
  predicted_by: 존 F. 케네디
  predicted_by_en: John F. Kennedy
  by_id: kennedy
  predicted_in: 1961
  predicted_for: 1960년대 안
  predicted_for_en: Before the end of the 1960s
  predicted_for_year: 1969
  actual_year: 1969
  actual_label: 아폴로 11호가 1969년 7월 20일 달에 착륙
  actual_label_en: Apollo 11 landed on the Moon on July 20, 1969
  status: on_time
  what: 국가가 사람을 달에 보내고 무사히 지구로 돌려보내겠다는 목표였습니다.
  what_en: A national goal to land a person on the Moon and return them safely to Earth.
  outcome: 목표가 제시된 지 8년 뒤 아폴로 11호가 달에 착륙했습니다.
  outcome_en: Apollo 11 landed eight years after the goal was set.
  lesson: 명확한 목표와 막대한 예산, 단일한 지휘 체계가 있으면 어려운 기술 일정도 맞출 수 있습니다.
  lesson_en: A clear goal, large budget, and unified command can make a hard technology schedule possible.
  source: https://www.nasa.gov/history/the-decision-to-go-to-the-moon/
