  predicted_for_en: An $80 billion market by 2025
  predicted_for_year: 2025
  actual_label: 2025년 XR 기기 출하는 약 1,450만 대, 시장 규모는 예측치의 몇 분의 일에 그침
  actual_label_en: XR device shipments were about 14.5 million units in 2025, a fraction of the forecast market size
  status: missed
  what: 2016년 오큘러스 리프트 출시와 함께 VR·AR이 차세대 컴퓨팅 플랫폼이 되어 2025년 800억달러 시장으로 큰다는 예측입니다.
  what_en: A prediction that with the 2016 Oculus Rift launch, VR and AR would become the next computing platform and an $80 billion market by 2025.
  outcome: VR은 게임 중심의 틈새 시장에 머물렀고, 2025년 실제 시장은 예측 규모에 크게 못 미쳤습니다.
  outcome_en: VR stayed a gaming-centric niche, and the actual 2025 market fell far short of the forecast.
  lesson: 하드웨어 출시가 곧 플랫폼 전환은 아닙니다. 착용 부담과 킬러 유즈케이스 부재 같은 수요 쪽 병목은 공급 일정표로 풀리지 않습니다.
  lesson_en: Shipping hardware is not a platform shift; demand-side bottlenecks like wearing comfort and missing killer apps are not solved by supply roadmaps.
  source: https://www.cnbc.com/2016/01/14/virtual-reality-could-become-an-80b-industry-goldman.html
  source_label: 2016년 골드만삭스 VR·AR 전망 보도
  source_label_en: 2016 report on the Goldman Sachs VR/AR forecast
  actual_source: https://www.idc.com/promo/arvr/
  actual_source_label: IDC AR·VR 헤드셋 시장 집계
  actual_source_label_en: IDC AR/VR headset market tracker

- id: cultivated-meat-early-2020s-retail
  name: 2020년대 초 배양육 매장 판매
  name_en: Cultivated Meat in Stores in the Early 2020s
  predicted_by: 멤피스미츠 (현 업사이드푸즈)
  predicted_by_en: Memphis Meats (now Upside Foods)
  by_id: memphis-meats
  predicted_in: 2017
  predicted_for: 2021년까지 매장 판매
  predicted_for_en: In stores by 2021
  predicted_for_year: 2021
  actual_year: 2024
  actual_label: 세계 첫 소매 판매가 2024년 싱가포르에서 시작 — 배양 성분 3% 혼합 제품
  actual_label_en: The first retail sales began in Singapore in 2024, with a blended product containing 3% cultivated cells
  status: late
  what: 세포를 배양해 만든 고기가 2021년까지 일반 매장에서 팔린다는 예측입니다.
  what_en: A prediction that meat grown from animal cells would be sold in ordinary stores by 2021.
  outcome: 첫 소매 판매까지 3년이 더 걸렸고, 그마저 배양 성분 3%의 혼합 제품 한 종이었습니다. 일상 상품이 되는 일은 아직 진행 중입니다.
  outcome_en: The first retail sale took three extra years, and even that was a single blended product with 3% cultivated content; everyday availability is still in progress.
  lesson: 규제 승인과 생산 원가는 시식회 성공과 별개의 시계로 움직입니다. "판매 시작"과 "약속했던 제품"이 같지 않을 수 있습니다.
  lesson_en: Regulatory approval and production cost move on a different clock from tasting demos, and the first sale may not be the product that was promised.
  source: https://www.inc.com/magazine/201711/jeff-bercovici/memphis-meats-lab-grown-meat-startup.html
  source_label: 2017년 멤피스미츠 보도 (2021년 매장 판매 목표)
  source_label_en: 2017 report on Memphis Meats targeting stores by 2021
  actual_source: https://www.goodmeat.co/all-news/good-meat-begins-the-worlds-first-retail-sales-of-cultivated-chicken
  actual_source_label: GOOD Meat 세계 첫 소매 판매 발표
  actual_source_label_en: GOOD Meat announcement of the first retail sales

- id: quantum-kookaburra-2025
  name: IBM Kookaburra 4,158큐비트 시스템
  name_en: IBM Kookaburra 4,158-Qubit System
  predicted_by: IBM Quantum
  predicted_by_en: IBM Quantum
  by_id: ibm-quantum
  predicted_in: 2022
  predicted_for: 2025년 4,158큐비트 멀티칩 시스템
  predicted_for_en: A 4,158-qubit multi-chip system in 2025
  predicted_for_year: 2025
  actual_label: 2025년까지 원래 정의의 4,158큐비트 시스템은 공개되지 않았고, 로드맵은 오류정정·논리 큐비트 중심으로 재정의됨
  actual_label_en: The originally defined 4,158-qubit system was not released by 2025; the roadmap shifted toward error correction and logical qubits
  status: missed
  what: Kookaburra 1,386큐비트 칩 3개를 양자 통신으로 연결해 2025년에 4,158큐비트 시스템을 제공한다는 제조사 로드맵이었습니다.
  what_en: IBM's roadmap called for connecting three 1,386-qubit Kookaburra chips into a 4,158-qubit system in 2025.
  outcome: 현재 로드맵의 Kookaburra는 대규모 물리 큐비트 수 대신 논리 처리장치와 양자 메모리를 검증하는 단계로 바뀌었습니다.
  outcome_en: The current roadmap recasts Kookaburra as a step for demonstrating a logical processing unit and quantum memory rather than the original physical-qubit scale target.
  lesson: 초기 양자 로드맵은 물리 큐비트 수를 키우는 목표에서 오류정정 품질을 높이는 목표로 바뀔 수 있어, 같은 이름의 후속 계획도 달성 정의를 다시 확인해야 합니다.
  lesson_en: Quantum roadmaps can shift from physical-qubit scale to error-correction quality, so even a retained project name may no longer represent the same success criterion.
  source: https://www.ibm.com/quantum/blog/ibm-quantum-roadmap-2025
  source_label: IBM 2022 Quantum 로드맵의 Kookaburra 목표
  source_label_en: IBM's 2022 Kookaburra roadmap target
  actual_source: https://www.ibm.com/roadmaps/quantum/
  actual_source_label: IBM 현재 Quantum 로드맵
  actual_source_label_en: IBM's current Quantum roadmap
