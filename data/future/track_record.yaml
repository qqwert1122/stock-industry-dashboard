  source_label_en: NASA record of Kennedy's Moon goal

- id: human-genome-project
  name: 인간 게놈 해독
  name_en: Human Genome Sequencing
  predicted_by: 인간 게놈 프로젝트
  predicted_by_en: Human Genome Project
