- id: newell-simon-chess
  name: 체스 세계챔피언 격파 AI
  name_en: AI Defeats the World Chess Champion
  predicted_by: 뉴웰·사이먼
  predicted_by_en: Newell and Simon
  by_id: newell-simon
  predicted_in: 1958
  predicted_for: 1968년까지
  predicted_for_en: By 1968
  predicted_for_year: 1968
  actual_year: 1997
  actual_label: IBM 딥블루가 가리 카스파로프를 표준 대국 조건의 6번기에서 이김
  actual_label_en: IBM Deep Blue beat Garry Kasparov in a six-game match under standard tournament controls
  status: late
  what: 컴퓨터가 인간 체스 세계챔피언을 이길 수 있다는 예측입니다.
  what_en: A prediction that a computer would beat the human world chess champion.
  outcome: 방향은 맞았지만 10년이 아니라 거의 40년이 걸렸습니다.
  outcome_en: The direction was right, but it took nearly 40 years instead of 10.
  lesson: 규칙이 명확한 문제도 하드웨어와 탐색 기법이 충분히 싸질 때까지 시간이 필요했습니다.
  lesson_en: Even a rule-bound problem needed enough hardware and search technique to become affordable.
  source: https://quoteinvestigator.com/2024/04/18/ai-prediction/
  source_label: Quote Investigator의 1958년 예측 검증
  source_label_en: Quote Investigator on the 1958 prediction
  actual_source: https://www.ibm.com/history/deep-blue
  actual_source_label: IBM 딥블루 기록
  actual_source_label_en: IBM Deep Blue history

- id: clarke-comsat
  name: 정지궤도 통신위성
  name_en: Geostationary Communication Satellites
  predicted_by: 아서 클라크
  predicted_by_en: Arthur C. Clarke
  by_id: clarke
  predicted_in: 1945
  predicted_for: 1960년대
  predicted_for_en: The 1960s
  predicted_for_year: 1965
  actual_year: 1965
  actual_label: 인텔샛 1호(Early Bird) 상업 통신위성 발사
  actual_label_en: Intelsat I Early Bird commercial communications satellite launched
  status: on_time
  what: 지구 위 같은 자리에 떠 있는 위성으로 전 세계 통신을 중계한다는 예측입니다.
  what_en: A prediction that satellites fixed above Earth could relay global communications.
  outcome: 20년 뒤 실제 상업 통신위성이 같은 아이디어를 현실로 만들었습니다.
  outcome_en: Twenty years later, a commercial satellite made the idea real.
  lesson: 물리 법칙과 궤도 계산에 기반한 예측은 제품 수요 예측보다 시점이 잘 맞을 수 있습니다.
  lesson_en: Predictions grounded in physics and orbital math can time better than product-demand forecasts.
  source: https://lakdiva.org.lk/clarke/1945ww/
