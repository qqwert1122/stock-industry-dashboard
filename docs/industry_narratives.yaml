# LLM-ready market narrative context.
# Keep this file compact: Gemini receives only the industries that matter for the day's briefing.
# Updated: 2026-07-07
as_of: "2026-07-07"
global_frame: "2026년 시장은 AI 인프라 투자와 전력/메모리 병목이 성장 내러티브를 만들고, 중동 리스크·에너지 가격·관세·높은 금리가 할인율과 수요를 압박하는 구도다."
common_rules:
  - "대표주가 변동은 실물지표가 아니라 기대·위험선호·실적 선반영 신호로 설명한다."
  - "월간·분기 지표는 발표 시차가 있으므로 오늘 바뀐 지표와 오래된 지표를 구분한다."
  - "가격 지표는 매출 성장인지 비용 부담인지 산업별로 반대 의미가 될 수 있다."
stock_market:
  narrative: "주식시장은 AI CAPEX와 이익 성장이 버팀목이지만, 높은 밸류에이션·금리/인플레 재상승·에너지/관세 리스크 때문에 좋은 실적에도 멀티플 디레이팅과 차익실현이 나올 수 있는 국면이다."
  key_signals: ["대표주가-업황 지표 괴리", "S&P500/나스닥 breadth", "VIX", "국채금리/신용스프레드", "빅테크 CAPEX 지속성"]
  lens: "실물 지표가 좋은데 주가가 빠지면 업황 훼손으로 단정하지 말고 기대치가 너무 높았는지, 금리와 할인율이 올랐는지, AI 투자 수익성 의심이나 포지션 청산이 있는지 먼저 설명한다."
  rotation: "AI 순수 성장주에서 전력·데이터센터·방산·소재처럼 물리적 병목과 진입장벽을 가진 인프라/실물자산 쪽으로 리더십이 넓어질 수 있다."
industries:
  반도체:
    narrative: "AI 서버/HBM 실적과 WSTS 판매는 강하지만, 반도체 주가는 밸류에이션 부담·차익실현·수출규제/관세·AI CAPEX 지속성 의심으로 크게 눌릴 수 있는 괴리 구간이다."
    key_metrics: ["WSTS 판매액", "한국 반도체 수출", "반도체 PPI", "삼성전자/SK하이닉스/NVIDIA/Micron 주가"]
    lens: "판매액·수출은 좋은데 대표주가가 급락하면 업황 훼손보다 기대 재조정/멀티플 디레이팅 가능성을 먼저 설명하고, HBM 수급·가이던스·빅테크 CAPEX 지속성을 다음 확인 포인트로 둔다."
  데이터인프라:
    narrative: "하이퍼스케일러 CAPEX, 전력 확보, 데이터센터 병목이 AI 인프라 투자 내러티브의 핵심이다."
    key_metrics: ["빅테크 CAPEX", "Microsoft/NAVER 주가", "전력 관련 지표"]
    lens: "CAPEX 증가는 서버·GPU·전력장비 수요에 우호적이지만 전력 제약은 속도 제한 요인이다."
  자동차:
    narrative: "높은 금리, 관세, 중국 경쟁, EV 전환 비용 때문에 판매량과 마진 방어가 같이 중요하다."
    key_metrics: ["미국 자동차 판매", "한국 승용차 수출", "현대차/Toyota 주가"]
    lens: "판매와 수출이 버티면 수요 방어, 주가만 강하면 환율·주주환원·관세 기대를 따로 확인한다."
  전기차:
    narrative: "전기차 성장은 이어지지만 중국 중심 성장과 북미 정책/수요 둔화가 갈라지는 시장이다."
    key_metrics: ["한국 전기차 수출", "미국 충전소/포트", "LG에너지솔루션/Tesla 주가"]
    lens: "수출·충전 인프라가 좋아야 실수요 개선이고, 주가 변동은 정책·가격경쟁 기대를 함께 본다."
  조선:
    narrative: "LNG선·친환경선·함정 수요와 긴 인도 기간이 고부가 선박 내러티브를 만든다."
    key_metrics: ["한국 선박 수출", "HD현대중공업/HII 주가", "운임·신조선가 후보"]
    lens: "수출과 선가/수주가 같이 좋으면 실적 가시성, 주가만 강하면 수주 기대 선반영으로 본다."
  철강/소재:
    narrative: "중국 부동산/제조업 수요, 관세, 전력·AI 인프라용 구리 수요가 소재 가격을 흔든다."
    key_metrics: ["철광석", "구리", "알루미늄", "POSCO/Nucor 주가"]
    lens: "원자재 상승은 소재 업체엔 판가 기대지만 제조업엔 비용 부담이라 수요 지표와 같이 해석한다."
  화학/정유:
    narrative: "중동 리스크와 정제마진, 석유화학 공급과잉/중국 수요가 방향성을 가른다."
    key_metrics: ["WTI/Brent", "화학 PPI", "LG화학/Exxon Mobil 주가"]
    lens: "유가 상승은 정유엔 마진 기회일 수 있지만 화학엔 원가 부담일 수 있어 스프레드 관점으로 본다."
  은행/금융:
    narrative: "금리 경로, 신용스프레드, 연체율, 대출 성장의 조합이 금융주 품질을 결정한다."
    key_metrics: ["국채금리", "회사채 OAS/한국 신용스프레드", "연체율", "은행 대출"]
    lens: "스프레드·연체율 하락은 안정 신호, 대출 증가와 주가 강세가 함께 나오면 경기 신뢰가 강하다."
  건설/부동산:
    narrative: "모기지 금리와 주택 재고/착공이 핵심이며, 높은 금리는 수요와 건설 마진을 압박한다."
    key_metrics: ["주택착공", "건축허가", "모기지 금리", "주택가격", "한국 미분양"]
    lens: "착공·허가 개선은 선행 신호지만 모기지 금리 상승과 미분양 증가는 부담으로 본다."
  방산:
    narrative: "NATO·미국·한국의 국방비 확대, 우크라이나/중동 리스크, 생산능력 병목이 수주 내러티브다."
    key_metrics: ["방산 신규주문", "수주잔고", "USAspending 계약", "한국 무기 수출"]
    lens: "계약·수주잔고 증가는 실수요, 주가만 강하면 예산 기대가 실제 계약으로 이어지는지 확인한다."
  스테이블코인:
    narrative: "규제 명확화와 결제/온체인 달러 수요가 유통량과 관련 주가의 핵심 변수다."
    key_metrics: ["전체/USDT/USDC 유통량", "Coinbase/Circle 주가"]
    lens: "유통량 증가는 크립토 유동성·결제 수요 신호, 주가 변동은 규제와 거래대금 기대를 구분한다."
  전력:
    narrative: "AI 데이터센터 전력 수요와 송전/변압기 병목이 전력 인프라 투자의 핵심이다."
    key_metrics: ["전력 PPI", "유틸리티 산업생산", "전력 판매/가격", "한국 전력장비 수출"]
    lens: "수요·가격·장비수출이 같이 오르면 인프라 사이클, 에너지 원가 상승은 마진 부담도 같이 본다."
  로봇:
    narrative: "휴머노이드 관심은 강하지만 실제 상용화는 산업 자동화 주문, 로봇 수출, 부품/제어장치 수요로 확인해야 한다."
    key_metrics: ["산업용 기계 신규주문", "산업 제어장치 PPI", "한국 로봇 수출", "두산로보틱스/Teradyne 주가"]
    lens: "대표주가 급등락은 기대 변화일 수 있어 실제 주문·수출이 따라오는지 확인한다."
  우주:
    narrative: "발사 빈도, NASA/국방 계약, 위성·항공우주 부품 가격이 민간 우주와 국방 우주의 연결고리다."
    key_metrics: ["우주 발사 건수", "NASA 계약", "항공우주 PPI", "우주/방산 산업생산"]
    lens: "이벤트 지표는 변동성이 크므로 계약과 생산 지표가 같이 움직이는지 본다."
  바이오:
    narrative: "FDA 승인, 후기 임상, 비만/항암/면역질환 파이프라인, 자금조달과 M&A 기대가 핵심이다."
    key_metrics: ["FDA 승인 활동", "Phase 3 임상 시작", "바이오 PPI", "바이오 의약품 수출"]
    lens: "승인·임상 증가는 파이프라인 모멘텀, 대표주가 변동은 개별 이벤트와 섹터 자금흐름을 구분한다."
  배터리:
    narrative: "EV 성장 둔화 우려와 배터리 가격 하락, 니켈/리튬 등 원재료 가격, 중국 경쟁이 핵심이다."
    key_metrics: ["배터리 PPI", "니켈 가격", "한국 축전지 수출", "삼성SDI/Albemarle 주가"]
    lens: "원재료 하락은 비용 완화지만 판가 하락 압력일 수도 있어 수출과 마진 관점으로 같이 본다."
  매크로:
    narrative: "AI 투자와 견조한 경기가 버팀목이지만, 인플레이션·중동 리스크·금리 재상승 가능성이 위험자산 할인율을 흔든다."
    key_metrics: ["원/달러 환율", "VIX", "코스피/코스닥/나스닥/S&P500/다우"]
    lens: "환율·VIX 상승은 리스크 회피, 지수 상승은 위험선호로 보되 금리와 에너지 가격 배경을 함께 본다."
