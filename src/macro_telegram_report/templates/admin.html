<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>수집 로그</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #f7f7f7;
      --text: #171717;
      --muted: #6d6d6d;
      --line: #e6e6e6;
      --ok: #15803d;
      --ok-bg: rgba(22, 163, 74, 0.12);
      --warn: #a16207;
      --warn-bg: rgba(234, 179, 8, 0.16);
      --bad: #b91c1c;
      --bad-bg: rgba(239, 68, 68, 0.13);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111111;
        --panel: #1d1d1d;
        --text: #f2f2f2;
        --muted: #a7a7a7;
        --line: #303030;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 24px; }
    .muted { color: var(--muted); font-size: 13px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }
    .toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .admin-stack {
      display: grid;
      gap: 16px;
    }
    .admin-section,
    .record-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
    }
    .section-head,
    .record-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }
    .section-title,
    .record-title {
      font-size: 15px;
      font-weight: 750;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .summary-card {
      min-width: 0;
      border-radius: 14px;
      background: rgba(127, 127, 127, 0.08);
      padding: 10px 12px;
    }
    .summary-card strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      margin-bottom: 5px;
    }
    .summary-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    .run-select-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    tr.is-active td { background: rgba(127, 127, 127, 0.10); }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .success { color: var(--ok); background: var(--ok-bg); }
    .no_new_data { color: var(--warn); background: var(--warn-bg); }
    .failed { color: var(--bad); background: var(--bad-bg); }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .pager-actions {
      display: flex;
      gap: 6px;
    }
    .pager button {
      min-width: 34px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      background: rgba(127, 127, 127, 0.10);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    .pager button:disabled {
      cursor: default;
      opacity: 0.35;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      background: rgba(127, 127, 127, 0.08);
    }
    tr:last-child td { border-bottom: 0; }
    .endpoint {
      max-width: 280px;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
    }
    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 820px) {
      header { display: grid; align-items: start; }
      .summary-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .record-panel { overflow-x: auto; }
      table { min-width: 760px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>수집 로그</h1>
        <div class="muted" id="updatedAt">데이터를 불러오는 중</div>
      </div>
      <a class="muted" href="../">대시보드로 돌아가기</a>
    </header>
    <div class="toolbar">
      <label><input type="checkbox" id="failedOnly"> 실패만 보기</label>
    </div>
    <section class="admin-stack">
      <div class="admin-section" id="freshnessPanel"></div>
      <div class="admin-section" id="runList"></div>
      <div class="record-panel" id="recordPanel"></div>
    </section>
  </main>
  <script>
    const pageSize = 10;
    const recordPageSize = 15;
    const state = {
      history: null,
      dashboard: null,
      selectedRunId: "",
      failedOnly: false,
      runPage: 0,
      recordPage: 0,
      freshnessPage: 0,
    };
    const statusLabels = {
      success: "업데이트",
      no_new_data: "신규 없음",
      failed: "실패",
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function formatDate(value) {
      const date = new Date(value || "");
      if (Number.isNaN(date.getTime())) return value || "";
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).format(date);
    }

    function runSummary(run) {
      const summary = run.summary || {};
      return ["success", "no_new_data", "failed"].map((status) => {
        const count = Number(summary[status] || 0);
        return `<span class="badge ${status}">${escapeHtml(statusLabels[status])} ${count}</span>`;
      }).join("");
    }

    function pageCount(total, size) {
      return Math.max(1, Math.ceil(Number(total || 0) / size));
    }

    function clampPage(value, total, size) {
      return Math.min(Math.max(0, Number(value) || 0), pageCount(total, size) - 1);
    }

    function pageSlice(items, page, size) {
      return items.slice(page * size, (page + 1) * size);
    }

    function pagerMarkup(kind, page, total, size) {
      if (total <= size) return "";
      const pages = pageCount(total, size);
      return `<div class="pager">
        <span>${(page * size) + 1}-${Math.min(total, (page + 1) * size)} / ${total}</span>
        <span class="pager-actions">
          <button type="button" data-page-kind="${escapeHtml(kind)}" data-page="${page - 1}" ${page <= 0 ? "disabled" : ""} aria-label="이전">‹</button>
          <button type="button" data-page-kind="${escapeHtml(kind)}" data-page="${page + 1}" ${page >= pages - 1 ? "disabled" : ""} aria-label="다음">›</button>
        </span>
      </div>`;
    }

    function initPagerButtons(root = document) {
      root.querySelectorAll("[data-page-kind]").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.disabled) return;
          const page = Number(button.dataset.page) || 0;
          if (button.dataset.pageKind === "runs") {
            state.runPage = page;
            renderRuns();
          } else if (button.dataset.pageKind === "records") {
            state.recordPage = page;
            renderRecords();
          } else if (button.dataset.pageKind === "freshness") {
            state.freshnessPage = page;
            renderFreshness();
          }
        });
      });
    }

    function freshnessSourceState(source) {
      if (Number(source.failed_count || 0) > 0) return "failed";
      if (Number(source.delayed_count || 0) > 0) return "no_new_data";
      return "success";
    }

    function renderFreshness() {
      const panel = document.getElementById("freshnessPanel");
      const summary = state.dashboard?.freshness_summary || {};
      const sources = Array.isArray(summary.sources) ? summary.sources : [];
      const total = Number(summary.total_count || 0);
      if (!total) {
        panel.innerHTML = `<div class="section-head"><div><div class="section-title">데이터 업데이트 현황</div><div class="muted">표시할 업데이트 현황이 없습니다.</div></div></div>`;
        return;
      }
      state.freshnessPage = clampPage(state.freshnessPage, sources.length, pageSize);
      const rows = pageSlice(sources, state.freshnessPage, pageSize).map((source) => {
        const status = freshnessSourceState(source);
        return `<tr>
          <td><span class="badge ${status}">${escapeHtml(statusLabels[status] || status)}</span></td>
          <td>${escapeHtml(source.name || "")}</td>
          <td>${Number(source.total_count || 0)}</td>
          <td>${Number(source.current_count || 0)}</td>
          <td>${Number(source.updated_count || 0)}</td>
          <td>${Number(source.waiting_count || 0)}</td>
          <td>${Number(source.delayed_count || 0)}</td>
          <td>${Number(source.failed_count || 0)}</td>
          <td>${escapeHtml(formatDate(source.last_checked_at))}</td>
          <td>${escapeHtml(source.latest_observed_at || "")}</td>
        </tr>`;
      }).join("");
      panel.innerHTML = `<div class="section-head">
          <div>
            <div class="section-title">데이터 업데이트 현황</div>
            <div class="muted">마지막 확인 ${escapeHtml(formatDate(summary.last_checked_at || summary.generated_at))} · 최신 관측 ${escapeHtml(summary.latest_observed_at || "-")}</div>
          </div>
          <span class="badge ${escapeHtml(summary.status === "failed" ? "failed" : summary.status === "delayed" ? "no_new_data" : "success")}">${escapeHtml(total)}개 중 ${escapeHtml(summary.current_count || 0)}개 정상</span>
        </div>
        <div class="summary-cards">
          <div class="summary-card"><strong>${Number(summary.current_count || 0)}</strong><span>정상</span></div>
          <div class="summary-card"><strong>${Number(summary.updated_count || 0)}</strong><span>새 값 반영</span></div>
          <div class="summary-card"><strong>${Number(summary.waiting_count || 0)}</strong><span>발표 대기</span></div>
          <div class="summary-card"><strong>${Number(summary.delayed_count || 0)}</strong><span>갱신 지연</span></div>
          <div class="summary-card"><strong>${Number(summary.failed_count || 0)}</strong><span>수집 실패</span></div>
        </div>
        ${rows ? `<div class="table-wrap"><table>
          <thead>
            <tr>
              <th>상태</th>
              <th>소스</th>
              <th>전체</th>
              <th>정상</th>
              <th>업데이트</th>
              <th>대기</th>
              <th>지연</th>
              <th>실패</th>
              <th>마지막 확인</th>
              <th>최신 관측</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table></div>${pagerMarkup("freshness", state.freshnessPage, sources.length, pageSize)}` : `<div class="empty">소스별 현황이 없습니다.</div>`}`;
      initPagerButtons(panel);
    }

    function renderRuns() {
      const runs = [...(state.history?.runs || [])].reverse();
      const list = document.getElementById("runList");
      if (!runs.length) {
        list.innerHTML = `<div class="empty">수집 로그가 없습니다.</div>`;
        return;
      }
      if (!state.selectedRunId) state.selectedRunId = String(runs[0].run_id || "");
      state.runPage = clampPage(state.runPage, runs.length, pageSize);
      const rows = pageSlice(runs, state.runPage, pageSize).map((run) => {
        const id = String(run.run_id || "");
        return `<tr class="${id === state.selectedRunId ? "is-active" : ""}">
          <td><button class="run-select-button" type="button" data-run-id="${escapeHtml(id)}">${escapeHtml(run.run_type || "run")}</button></td>
          <td>${escapeHtml(formatDate(run.started_at))}</td>
          <td>${escapeHtml(formatDate(run.finished_at))}</td>
          <td>${Number(run.duration_ms || 0).toLocaleString("ko-KR")}</td>
          <td><span class="badges">${runSummary(run)}</span></td>
        </tr>`;
      }).join("");
      list.innerHTML = `<div class="section-head">
          <div>
            <div class="section-title">수집 실행 목록</div>
            <div class="muted">${runs.length}개 실행 기록</div>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead>
            <tr>
              <th>유형</th>
              <th>시작</th>
              <th>종료</th>
              <th>ms</th>
              <th>결과</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table></div>
        ${pagerMarkup("runs", state.runPage, runs.length, pageSize)}`;
      list.querySelectorAll("[data-run-id]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedRunId = button.dataset.runId || "";
          state.recordPage = 0;
          renderRuns();
          renderRecords();
        });
      });
      initPagerButtons(list);
    }

    function selectedRun() {
      return (state.history?.runs || []).find((run) => String(run.run_id || "") === state.selectedRunId) || null;
    }

    function renderRecords() {
      const panel = document.getElementById("recordPanel");
      const run = selectedRun();
      if (!run) {
        panel.innerHTML = `<div class="empty">실행을 선택하세요.</div>`;
        return;
      }
      const records = (run.records || []).filter((record) => !state.failedOnly || record.status === "failed");
      state.recordPage = clampPage(state.recordPage, records.length, recordPageSize);
      const rows = pageSlice(records, state.recordPage, recordPageSize).map((record) => `<tr>
        <td><span class="badge ${escapeHtml(record.status)}">${escapeHtml(statusLabels[record.status] || record.status)}</span></td>
        <td>${escapeHtml(record.source)}</td>
        <td>${escapeHtml(record.message)}</td>
        <td>${Number(record.metric_count || 0)}</td>
        <td>${Number(record.new_data_count || 0)}</td>
        <td>${Number(record.duration_ms || 0).toLocaleString("ko-KR")}</td>
        <td>${record.http_status ?? ""}</td>
        <td class="endpoint">${escapeHtml(record.endpoint)}</td>
      </tr>`).join("");
      panel.innerHTML = `<div class="record-head">
          <div>
            <div class="record-title">${escapeHtml(run.run_type || "run")} 실행 상세</div>
            <div class="muted">${escapeHtml(formatDate(run.started_at))} - ${escapeHtml(formatDate(run.finished_at))}</div>
          </div>
          <div class="badges">${runSummary(run)}</div>
        </div>
        ${rows ? `<div class="table-wrap"><table>
          <thead>
            <tr>
              <th>상태</th>
              <th>소스</th>
              <th>메시지</th>
              <th>지표</th>
              <th>신규</th>
              <th>ms</th>
              <th>HTTP</th>
              <th>endpoint</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table></div>${pagerMarkup("records", state.recordPage, records.length, recordPageSize)}` : `<div class="empty">표시할 기록이 없습니다.</div>`}`;
      initPagerButtons(panel);
    }

    async function load() {
      try {
        const [logResponse, dashboardResponse] = await Promise.all([
          fetch("../data/fetch_log.json", { cache: "no-store" }),
          fetch("../data/dashboard.json", { cache: "no-store" }),
        ]);
        if (!logResponse.ok) throw new Error(`fetch_log HTTP ${logResponse.status}`);
        state.history = await logResponse.json();
        if (dashboardResponse.ok) {
          state.dashboard = await dashboardResponse.json();
        } else {
          state.dashboard = {};
        }
        document.getElementById("updatedAt").textContent = `최근 갱신: ${formatDate(state.history.updated_at)}`;
      } catch (error) {
        state.history = { runs: [] };
        state.dashboard = {};
        document.getElementById("updatedAt").textContent = `수집 로그를 불러오지 못했습니다: ${error.message}`;
      }
      renderFreshness();
      renderRuns();
      renderRecords();
    }

    document.getElementById("failedOnly").addEventListener("change", (event) => {
      state.failedOnly = event.target.checked;
      state.recordPage = 0;
      renderRecords();
    });
    load();
  </script>
</body>
</html>
