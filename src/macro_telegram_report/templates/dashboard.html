    function noteKeyForMetric(metric) {
      return String(metric?.history_key || metric?.id || metric?.name || "");
    }

    function makeNoteEntryId() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function normalizeNoteEntry(entry, index = 0, fallbackMetricName = "") {
      if (!entry || typeof entry !== "object") return null;
      const text = String(entry.text || "").trim();
      if (!text) return null;
      const now = new Date().toISOString();
      const updatedAt = String(entry.updated_at || entry.created_at || now);
      return {
        id: String(entry.id || `${updatedAt}-${index}`),
        text: text.slice(0, 2000),
        created_at: String(entry.created_at || updatedAt),
        updated_at: updatedAt,
        metric_name: String(entry.metric_name || fallbackMetricName || "")
      };
    }

    function sortNoteEntries(entries) {
      return [...entries].sort((a, b) => String(b.updated_at || b.created_at || "").localeCompare(String(a.updated_at || a.created_at || "")));
    }

    function normalizeMetricNoteRecord(note, fallbackMetricName = "") {
      if (!note || typeof note !== "object") return { metric_name: fallbackMetricName, entries: [] };
      const sourceEntries = Array.isArray(note.entries) ? note.entries : [note];
      const entries = sourceEntries
        .map((entry, index) => normalizeNoteEntry(entry, index, note.metric_name || fallbackMetricName))
        .filter(Boolean);
      return {
        metric_name: String(note.metric_name || fallbackMetricName || entries[0]?.metric_name || ""),
        entries: sortNoteEntries(entries)
      };
    }

    function normalizeNotesDocument(source) {
      const rawNotes = source && typeof source === "object" && source.notes && typeof source.notes === "object"
        ? source.notes
        : {};
      const notes = {};
      Object.entries(rawNotes).forEach(([key, note]) => {
        const record = normalizeMetricNoteRecord(note);
        if (record.entries.length) notes[key] = record;
      });
      return { version: 2, notes };
    }

    function loadMetricNotes() {
      try {
        const parsed = JSON.parse(localStorage.getItem(metricNotesStorageKey) || "{}");
        state.metricNotes = normalizeNotesDocument(parsed);
      } catch (_error) {
        state.metricNotes = { version: 1, notes: {} };
      }
    }

    function saveMetricNotesDocument(document = state.metricNotes) {
      state.metricNotes = normalizeNotesDocument(document);
      localStorage.setItem(metricNotesStorageKey, JSON.stringify(state.metricNotes));
    }

    function metricNote(metric) {
      const key = noteKeyForMetric(metric);
      return key ? state.metricNotes.notes[key] || null : null;
    }

    function metricNoteEntries(metric) {
      return sortNoteEntries(normalizeMetricNoteRecord(metricNote(metric), metric?.name || "").entries);
    }

    function metricLatestNote(metric) {
      return metricNoteEntries(metric)[0] || null;
    }

    function metricNoteText(metric) {
      return String(metricLatestNote(metric)?.text || "");
    }

    function metricHasNote(metric) {
      return metricNoteEntries(metric).length > 0;
    }

    function metricNotePreview(metric) {
      const firstLine = metricNoteText(metric).split(/\r?\n/).map((line) => line.trim()).find(Boolean);
      return firstLine || "";
    }

    function noteButtonMarkup(metric, className = "metric-note-button") {
      const active = metricHasNote(metric);
      const label = active ? t("myNote") : t("editNote");
      return `<button class="${className}${active ? " is-active" : ""}" type="button" data-note-open="${escapeHtml(metric.id)}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">
        <i class="fa-${active ? "solid" : "regular"} fa-note-sticky" aria-hidden="true"></i>
      </button>`;
    }

    function noteBlockMarkup(metric) {
      const entries = metricNoteEntries(metric);
      const text = String(entries[0]?.text || "").trim();
      if (!text) return "";
      return `<button class="metric-note-block" type="button" data-note-open="${escapeHtml(metric.id)}">
        <span class="metric-note-label">${escapeHtml(t("noteTitle"))}</span>
        <span class="metric-note-count" aria-label="${escapeHtml(`${entries.length}`)}">${escapeHtml(entries.length)}</span>
        <span class="metric-note-divider" aria-hidden="true">|</span>
        <span class="metric-note-preview">${escapeHtml(text)}</span>
      </button>`;
    }

    function noteUpdatedLabel(note) {
      const updated = note?.updated_at;
      if (!updated) return t("noteNeverSaved");
      return `${t("noteUpdatedAt")}: ${fetchedAtText(updated) || updated}`;
    }

    function setNoteModalOpen(open) {
      const modal = document.getElementById("noteModal");
      const backdrop = document.getElementById("noteModalBackdrop");
      if (!modal || !backdrop) return;
      modal.hidden = !open;
      backdrop.hidden = !open;
      document.body.classList.toggle("note-modal-open", Boolean(open));
      if (open) {
        updateNoteViewportOffset();
        window.setTimeout(() => document.getElementById("noteModalText")?.focus({ preventScroll: true }), 30);
      }
    }

    function updateNoteViewportOffset() {
      if (!window.visualViewport) return;
      const offset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
      document.documentElement.style.setProperty("--note-bottom-offset", `${Math.round(offset)}px`);
    }

    function updateNoteSaveButtonState() {
      const textarea = document.getElementById("noteModalText");
      const saveButton = document.getElementById("noteSaveButton");
      if (saveButton && textarea) saveButton.disabled = !String(textarea.value || "").trim();
      updateNoteCharCount();
    }

    function updateNoteCharCount() {
      const textarea = document.getElementById("noteModalText");
      const counter = document.getElementById("noteCharCount");
      if (!textarea || !counter) return;
      counter.textContent = `${String(textarea.value || "").length} / ${noteMaxLength}`;
    }

    function setNoteEditorValue(text = "", entryId = "") {
      const textarea = document.getElementById("noteModalText");
      state.activeNoteEntryId = entryId;
      state.noteInitialText = String(text || "").slice(0, noteMaxLength);
      if (textarea) {
        textarea.value = state.noteInitialText;
        textarea.placeholder = t("notePlaceholder");
        textarea.maxLength = noteMaxLength;
      }
      updateNoteSaveButtonState();
    }

    function noteHistoryItemMarkup(entry) {
      const timestamp = fetchedAtText(entry.updated_at || entry.created_at) || entry.updated_at || entry.created_at || "";
      return `<article class="note-history-item">
        <p class="note-history-text">${escapeHtml(entry.text)}</p>
        <div class="note-history-item-footer">
          <time class="note-history-time">${escapeHtml(timestamp)}</time>
          <span class="note-history-actions">
            <button class="note-history-action" type="button" data-note-edit="${escapeHtml(entry.id)}">${escapeHtml(t("edit"))}</button>
            <span aria-hidden="true">·</span>
            <button class="note-history-action" type="button" data-note-delete="${escapeHtml(entry.id)}">${escapeHtml(t("delete"))}</button>
          </span>
        </div>
      </article>`;
    }

    function renderNoteHistory(metric) {
      const list = document.getElementById("noteHistoryList");
      const count = document.getElementById("noteHistoryCount");
      const title = document.getElementById("noteHistoryTitle");
      if (!list) return;
      const entries = metricNoteEntries(metric);
      if (title) title.textContent = t("noteHistory");
      if (count) count.textContent = entries.length ? `${entries.length}${state.language === "ko" ? "개" : ""}` : "";
      list.innerHTML = entries.length
        ? entries.map(noteHistoryItemMarkup).join("")
        : `<p class="note-history-empty">${escapeHtml(t("noteHistoryEmpty"))}</p>`;
      list.querySelectorAll("[data-note-edit]").forEach((button) => {
        button.addEventListener("click", () => editNoteEntry(button.dataset.noteEdit));
      });
      list.querySelectorAll("[data-note-delete]").forEach((button) => {
        button.addEventListener("click", () => deleteNoteEntry(button.dataset.noteDelete));
      });
    }

    function openNoteEditor(metricId) {
      const metric = metricById(metricId);
      if (!metric) return;
      if (!document.getElementById("noteModal")?.hidden && state.activeNoteMetricId !== metric.id && noteModalDirty()) {
        if (!window.confirm(t("noteDiscardConfirm"))) return;
      }
      state.activeNoteMetricId = metric.id;
      const title = document.getElementById("noteModalTitle");
      const meta = document.getElementById("noteModalMeta");
      if (title) title.textContent = t("noteTitle");
      if (meta) meta.textContent = `${localizedField(metric, "name")} · ${localizedIndustry(metric.industry)} · ${localizedGroup(metric.group, [metric])}`;
      setNoteEditorValue("", "");
      renderNoteHistory(metric);
      setNoteModalOpen(true);
    }

    function noteModalDirty() {
      const textarea = document.getElementById("noteModalText");
      return Boolean(textarea && textarea.value !== state.noteInitialText);
    }

    function closeNoteEditor(force = false) {
      if (!force && noteModalDirty() && !window.confirm(t("noteDiscardConfirm"))) return;
      setNoteModalOpen(false);
      state.activeNoteMetricId = "";
      state.activeNoteEntryId = "";
      state.noteInitialText = "";
    }

    function refreshNotesViews() {
      buildSearchIndex();
      renderDailyUpdates();
      renderIndustries();
      renderMetricSearchHost();
    }

    function saveActiveNote() {
      const metric = metricById(state.activeNoteMetricId);
      const textarea = document.getElementById("noteModalText");
      if (!metric || !textarea) return;
      const key = noteKeyForMetric(metric);
      if (!key) return;
      const text = textarea.value.trim();
      const next = normalizeNotesDocument(state.metricNotes);
      if (text) {
        const now = new Date().toISOString();
        const record = normalizeMetricNoteRecord(next.notes[key], metric.name || "");
        const entries = [...record.entries];
        const index = state.activeNoteEntryId ? entries.findIndex((entry) => entry.id === state.activeNoteEntryId) : -1;
        if (index >= 0) {
          entries[index] = {
            ...entries[index],
            text: text.slice(0, noteMaxLength),
            updated_at: now,
            metric_name: metric.name || entries[index].metric_name || ""
          };
        } else {
          entries.unshift({
            id: makeNoteEntryId(),
            text: text.slice(0, noteMaxLength),
            created_at: now,
            updated_at: now,
            metric_name: metric.name || ""
          });
        }
        next.notes[key] = normalizeMetricNoteRecord({ metric_name: metric.name || "", entries }, metric.name || "");
      } else if (state.activeNoteEntryId) {
        deleteNoteEntry(state.activeNoteEntryId);
        return;
      } else {
        textarea.focus();
        return;
      }
      try {
        saveMetricNotesDocument(next);
      } catch (_error) {
        window.alert(t("noteSaveFailed"));
        return;
      }
      setNoteEditorValue("", "");
      renderNoteHistory(metric);
      refreshNotesViews();
    }

    function editNoteEntry(entryId) {
      const metric = metricById(state.activeNoteMetricId);
      if (!metric) return;
      const entry = metricNoteEntries(metric).find((item) => item.id === entryId);
      if (!entry) return;
      setNoteEditorValue(entry.text, entry.id);
      document.getElementById("noteModalText")?.focus({ preventScroll: true });
    }

    function deleteNoteEntry(entryId) {
      const metric = metricById(state.activeNoteMetricId);
      if (!metric || !entryId) return;
      const key = noteKeyForMetric(metric);
      const next = normalizeNotesDocument(state.metricNotes);
      const record = normalizeMetricNoteRecord(next.notes[key], metric.name || "");
      const entries = record.entries.filter((entry) => entry.id !== entryId);
      if (entries.length) {
        next.notes[key] = normalizeMetricNoteRecord({ metric_name: metric.name || "", entries }, metric.name || "");
      } else {
        delete next.notes[key];
      }
      try {
        saveMetricNotesDocument(next);
      } catch (_error) {
        window.alert(t("noteSaveFailed"));
        return;
      }
      if (state.activeNoteEntryId === entryId) setNoteEditorValue("", "");
      renderNoteHistory(metric);
      refreshNotesViews();
    }

    function initNoteButtons(root = document) {
      root.querySelectorAll("[data-note-open]").forEach((button) => {
        if (button.dataset.noteBound === "true") return;
        button.dataset.noteBound = "true";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          openNoteEditor(button.dataset.noteOpen);
        });
      });
    }

    function exportMetricNotes() {
      const blob = new Blob([JSON.stringify(state.metricNotes, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `dashboard-metric-notes-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function mergeMetricNotes(imported) {
      const current = normalizeNotesDocument(state.metricNotes);
      const incoming = normalizeNotesDocument(imported);
      Object.entries(incoming.notes).forEach(([key, note]) => {
        const existing = normalizeMetricNoteRecord(current.notes[key]);
        const merged = new Map(existing.entries.map((entry) => [entry.id, entry]));
        normalizeMetricNoteRecord(note).entries.forEach((entry) => {
          const previous = merged.get(entry.id);
          if (!previous || String(entry.updated_at || "") >= String(previous.updated_at || "")) {
            merged.set(entry.id, entry);
          }
        });
        const record = normalizeMetricNoteRecord({ entries: [...merged.values()] });
        if (record.entries.length) current.notes[key] = record;
      });
      saveMetricNotesDocument(current);
      refreshNotesViews();
    }

    function importMetricNotesFile(file) {
      if (!file) return;

    function toggleComparePanel(metricId) {
      if (state.compareBaseMetricId !== metricId) resetCompareState(metricId);

      ensureCompareHistory(metricId);
    }

    function compareVisibleForProposed(baseMetric, ids) {
      const previous = state.compareMetricIds;
      state.compareMetricIds = ids;
      const series = compareSeries(baseMetric);
      const visible = filterCompareSeries(series, compareTimeWindow(series));
      state.compareMetricIds = previous;
      return visible;
    }

    function addCompareMetric(metricId) {
      const baseMetric = metricById(state.compareBaseMetricId);
      if (!baseMetric || metricId === baseMetric.id || state.compareMetricIds.includes(metricId)) return;
      const proposed = [...state.compareMetricIds, metricId].slice(0, 3);
      if (proposed.length !== state.compareMetricIds.length + 1) {
        state.compareWarning = t("compareLimitCount");
        refreshMetricDetail(baseMetric.id);
        return;
      }
      const visible = compareVisibleForProposed(baseMetric, proposed);
      const positive = visible.length ? compareAllPositive(visible) : true;
      if (!positive && proposed.length > 1) {
        state.compareWarning = t("compareLimitRaw");
        refreshMetricDetail(baseMetric.id);
        return;
      }
      state.compareMetricIds = proposed;
      state.compareMode = proposed.length > 1 ? "indexed" : state.compareMode;
      state.compareQuery = "";
      state.compareResults = [];
      state.compareWarning = "";
      rememberCompareSet(baseMetric);
      refreshMetricDetail(baseMetric.id);
      ensureCompareHistory(baseMetric.id);
    }

    function addFirstCompareResult(metricId) {
      const baseMetric = metricById(metricId || state.compareBaseMetricId);
      if (!baseMetric) return;
      const candidates = (state.compareResults || [])
        .filter((item) => item.id !== baseMetric.id && !state.compareMetricIds.includes(item.id));
      if (candidates[0]) {
        addCompareMetric(candidates[0].id);
        return;
      }
      document.querySelector(`[data-compare-search="${CSS.escape(baseMetric.id)}"]`)?.focus();
    }

    function removeCompareMetric(metricId) {
      const baseMetric = metricById(state.compareBaseMetricId);
      state.compareMetricIds = state.compareMetricIds.filter((id) => id !== metricId);
      if (state.compareMetricIds.length <= 1 && state.compareMode === "indexed") state.compareMode = "raw";
      state.compareWarning = "";
      if (baseMetric) refreshMetricDetail(baseMetric.id);
    }

    function applyCompareSearch(query) {
      state.compareQuery = query;
      state.compareResults = normalizeSearchText(query) ? runMetricSearch(query) : [];
      renderCompareSearchResults(state.compareBaseMetricId);
    }

    function renderCompareSearchResults(metricId) {

    function scheduleCompareSearch(query) {

    }

    function setCompareMode(mode) {
      const baseMetric = metricById(state.compareBaseMetricId);
      if (!baseMetric) return;
      const series = compareSeries(baseMetric);
      const visible = filterCompareSeries(series, compareTimeWindow(series));
      if (mode === "raw" && visible.length > 2) {
        state.compareWarning = t("compareUnitLimit");
      } else if (mode === "indexed" && !compareAllPositive(visible)) {
        state.compareWarning = t("compareNeedsPositive");
      } else {
        state.compareMode = mode;
        state.compareWarning = "";
      }
      refreshMetricDetail(baseMetric.id);
    }

    function setCompareRange(range) {
      const baseMetric = metricById(state.compareBaseMetricId);
      state.compareRange = range || "all";
      state.compareWarning = "";
      if (baseMetric) refreshMetricDetail(baseMetric.id);
    }

    function restoreRecentCompare(idsText) {
      const baseMetric = metricById(state.compareBaseMetricId);
      if (!baseMetric) return;
      state.compareMetricIds = String(idsText || "").split(",").filter((id) => metricById(id) && id !== baseMetric.id).slice(0, 3);

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function csvText(rows) {
      return `\ufeff${rows.map((row) => row.map(csvEscape).join(",")).join("\n")}\n`;
    }

    function safeFileName(value) {
      return String(value || "metric")
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, "_")
        .slice(0, 80);
    }

    function downloadBlobText(filename, text) {
      const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function csvDateSuffix() {
      return dashboardTodayKey() || new Date().toISOString().slice(0, 10);
    }

    function metricExportPoints(metric) {
      const entry = state.longHistoryData?.[metric.id] || state.longHistoryData?.[metric.history_key];
      return entry ? longHistoryPoints(entry) : (metric.history || []);
    }

    function exportSingleMetricCsv(metric) {
      const rows = [["date", "value"], ...metricExportPoints(metric).map((point) => [point.date, point.value])];
      downloadBlobText(`${safeFileName(localizedField(metric, "name"))}_${csvDateSuffix()}.csv`, csvText(rows));
    }

    function exportCompareCsv(metric) {
      const series = compareSeries(metric);
      if (series.length < 2) {
        exportSingleMetricCsv(metric);
        return;
      }
      const headers = ["date", ...series.map((item) => localizedField(item.metric, "name"))];
      const dates = [...new Set(series.flatMap((item) => item.points.map((point) => point.date)))].sort();
      const valueMaps = series.map((item) => new Map(item.points.map((point) => [point.date, point.value])));
      const rows = [headers, ...dates.map((date) => [date, ...valueMaps.map((map) => map.has(date) ? map.get(date) : "")])];
      downloadBlobText(`${safeFileName(localizedField(metric, "name"))}_compare_${csvDateSuffix()}.csv`, csvText(rows));
    }

    function exportMetricCsv(metricId) {
      const metric = metricById(metricId);
      if (!metric) return;
      ensureLongHistory().then((data) => {
        state.longHistoryData = data;
        if (state.compareBaseMetricId === metric.id && state.compareMetricIds.length) {
          exportCompareCsv(metric);
        } else {
          exportSingleMetricCsv(metric);
        }
      });
    }

    function initGaugeCardScrollDrag(root = document) {
      root.querySelectorAll(".gauge-component-list").forEach((scroller) => {
        if (scroller.closest(".market-diagnosis")) return;
        if (scroller.dataset.dragScrollBound === "true") return;
        scroller.dataset.dragScrollBound = "true";
        let activePointerId = null;
        let didDrag = false;
        let hasPointerCapture = false;
        let suppressClick = false;
        let startX = 0;
        let startScrollLeft = 0;
        const threshold = 6;

        const endDrag = () => {
          if (activePointerId === null) return;
          if (hasPointerCapture) {
            scroller.releasePointerCapture?.(activePointerId);
          }
          activePointerId = null;
          hasPointerCapture = false;
          scroller.classList.remove("is-dragging");
          if (didDrag) {
            suppressClick = true;
            window.setTimeout(() => {
              suppressClick = false;
            }, 120);
          }
        };

        scroller.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "mouse" || event.button !== 0) return;
          activePointerId = event.pointerId;
          didDrag = false;
          startX = event.clientX;
          startScrollLeft = scroller.scrollLeft;
        });

        scroller.addEventListener("pointermove", (event) => {
          if (event.pointerId !== activePointerId) return;
          const deltaX = event.clientX - startX;
          if (Math.abs(deltaX) > threshold) {
            didDrag = true;
            scroller.classList.add("is-dragging");
            if (!hasPointerCapture) {
              scroller.setPointerCapture?.(event.pointerId);
              hasPointerCapture = true;
            }
            event.preventDefault();
          }
          if (didDrag) {
            scroller.scrollLeft = startScrollLeft - deltaX;
          }
        });

        scroller.addEventListener("pointerup", endDrag);
        scroller.addEventListener("pointercancel", endDrag);
        scroller.addEventListener("lostpointercapture", endDrag);

        scroller.addEventListener("click", (event) => {
          if (!suppressClick) return;
          event.preventDefault();
          event.stopPropagation();
        }, true);
      });
    }

    function localizedBriefingMetricName(item) {
      if (!item) return "";
      return item.id ? localizedMetricName(item.id, item.name || "") : englishMetricName(item.name || "");
    }

    function briefingDriverSentence(item) {
      const name = localizedBriefingMetricName(item);
      const industry = localizedIndustry(item?.industry);
      const change = item?.change_pct_label || item?.yoy_pct_label || "";
      const value = localizedValueLabel(item?.value || "");
      const moveText = change ? ` moved ${change}` : value ? ` is at ${value}` : " stands out";
      return `${industry ? `${industry}: ` : ""}${name}${moveText}. Check whether this reflects real activity, demand, or investment momentum.`;
    }

    function localizedBriefingView(briefing) {
      if (state.language !== "en") return briefing;
      const existingBullets = Array.isArray(briefing?.bullets) ? briefing.bullets : [];
      if (briefing?.headline_en || briefing?.summary_en) {
        return {
          ...briefing,
          headline: briefing.headline_en || localizedText(briefing.headline || ""),
          summary: briefing.summary_en || localizedText(briefing.summary || ""),
          bullets: existingBullets.map((item) => ({
            ...item,
            title: item.title_en || localizedText(item.title || ""),
            body: item.body_en || localizedText(item.body || "")
          }))
        };
      }
      const movers = Array.isArray(briefing?.top_movers) ? briefing.top_movers : [];
      const improving = Array.isArray(briefing?.improving_industries) ? briefing.improving_industries : [];
      const slowing = Array.isArray(briefing?.slowing_industries) ? briefing.slowing_industries : [];
      const top = movers[0];
      if (!top && !improving.length && !slowing.length) {
        return {
          ...briefing,
          headline: localizedText(briefing?.headline || "Market briefing updated."),
          summary: localizedText(briefing?.summary || ""),
          bullets: existingBullets.map((item) => ({
            ...item,
            title: localizedText(item.title || ""),
            body: localizedText(item.body || "")
          }))
        };
      }
      const improvingLead = improving[0];
      const slowingLead = slowing[0];
      const headline = top
        ? `${localizedIndustry(top.industry)}: ${localizedBriefingMetricName(top)}${top.change_pct_label ? ` moved ${top.change_pct_label}` : " stands out"}.`
        : "Market indicators updated.";
      const summaryParts = [];
      if (top) summaryParts.push(briefingDriverSentence(top));
      if (improvingLead) {
        const driver = improvingLead.drivers?.[0];
        summaryParts.push(`${localizedIndustry(improvingLead.industry)} is showing improving momentum${driver ? `, led by ${localizedBriefingMetricName(driver)}` : ""}.`);
      }
      if (slowingLead) {
        const driver = slowingLead.drivers?.[0];
        summaryParts.push(`${localizedIndustry(slowingLead.industry)} needs a closer watch${driver ? `, with ${localizedBriefingMetricName(driver)} still mixed` : ""}.`);
      }
      const bullets = [];
      if (top) {
        bullets.push({
          title: "Top mover",
          body: briefingDriverSentence(top),
          metric_ids: movers.map((item) => item.id).filter(Boolean).slice(0, 3)
        });
      }
      if (improvingLead) {
        const driver = improvingLead.drivers?.[0];
        bullets.push({
          title: "Improving trend",
          body: `${localizedIndustry(improvingLead.industry)} has relatively better recent readings${driver ? `, led by ${localizedBriefingMetricName(driver)} (${driver.change_pct_label || driver.yoy_pct_label || "updated"})` : ""}.`,
          metric_ids: (improvingLead.drivers || []).map((item) => item.id).filter(Boolean)
        });
      }
      if (slowingLead) {
        const driver = slowingLead.drivers?.[0];
        bullets.push({
          title: "Watch list",
          body: `${localizedIndustry(slowingLead.industry)} has weaker or mixed readings, so confirm whether the recovery continues${driver ? ` through ${localizedBriefingMetricName(driver)}` : ""}.`,
          metric_ids: (slowingLead.drivers || []).map((item) => item.id).filter(Boolean)
        });
      }
      return {
        ...briefing,
        headline,
        summary: summaryParts.join(" "),
        bullets
      };
    }

      const title = state.language === "en" ? localizedText(item?.title || "") : (item?.title || "");
      const body = state.language === "en" ? localizedText(item?.body || "") : (item?.body || "");

        return `${briefingCardTypeLabel(card)}${time ? ` ${time}` : ""}`.trim();
      }

    function briefingDateLabel(briefing) {
      const value = briefing?.generated_at || briefing?.generated_label || briefing?.date || "";
      return value ? dateTimeText(value) : "";
    }

    function briefingDateInputValue(briefing) {
      const value = briefing?.date || briefing?.generated_at || briefing?.generated_label || "";
      const match = String(value || "").match(/^(\d{4})[.-](\d{1,2})[.-](\d{1,2})/);
      if (!match) return "";
      const year = match[1];
      const month = String(Number(match[2])).padStart(2, "0");
      const day = String(Number(match[3])).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function briefingDisplayDateLabel(briefing) {
      const source = briefing?.generated_at || briefing?.generated_label || briefing?.date || "";
      const key = zonedDateKey(source);
      return key ? plainDateText(key) : t("irregular");

    function activeBriefingSummary(briefing, cards = briefingCards()) {
      const activeId = state.selectedBriefingId || briefing?.id || cards[0]?.id || "";
      return cards.find((card) => card.id === activeId) || briefing || cards[0] || {};
    }

    function renderBriefingTimeline(briefing) {
      const cards = briefingCards();
      if (!cards.length) return "";
      const activeCard = activeBriefingSummary(briefing, cards);
      const activeId = activeCard?.id || "";
      const activeIndex = Math.max(0, cards.findIndex((card) => card.id === activeId));
      const olderCard = cards[activeIndex + 1];
      const newerCard = cards[activeIndex - 1];
      const activeDate = briefingDateInputValue(activeCard);
      const activeDateLabel = briefingDisplayDateLabel(activeCard);
      const selectedTime = briefingChipLabel(activeCard) || t("irregular");
      return `<div class="briefing-timeline">
        <div class="briefing-date-row">
          <span class="briefing-date-control">
            <input class="briefing-date-picker" type="date" data-briefing-date-picker value="${escapeHtml(activeDate)}" aria-label="${escapeHtml(t("selectBriefingDate"))}">
            <button type="button" class="briefing-date-display" data-briefing-date-open aria-label="${escapeHtml(t("selectBriefingDate"))}">
              <i class="fa-regular fa-calendar" aria-hidden="true"></i>
              <span>${escapeHtml(activeDateLabel)}</span>
            </button>
          </span>
          <button type="button" class="briefing-nav-button" data-briefing-card-id="${escapeHtml(olderCard?.id || "")}" aria-label="${escapeHtml(t("previousBriefing"))}" ${olderCard ? "" : "disabled"}><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
          <span class="briefing-selected-time">${escapeHtml(selectedTime)}</span>
          <button type="button" class="briefing-nav-button" data-briefing-card-id="${escapeHtml(newerCard?.id || "")}" aria-label="${escapeHtml(t("nextBriefing"))}" ${newerCard ? "" : "disabled"}><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>

    function initBriefingTimeline() {
      document.querySelectorAll("[data-briefing-card-id]").forEach((button) => {

        button.dataset.briefingNavBound = "true";
        button.addEventListener("click", () => selectBriefingCard(button.dataset.briefingCardId));
      });
      const datePicker = document.querySelector("[data-briefing-date-picker]");
      document.querySelector("[data-briefing-date-open]")?.addEventListener("click", () => {
        if (!datePicker) return;
        if (typeof datePicker.showPicker === "function") {
          datePicker.showPicker();
          return;
        }
        datePicker.focus();
        datePicker.click();
      });
      datePicker?.addEventListener("change", (event) => {

        if (cards.length) selectBriefingCard(cards[0].id);

        .then((response) => (response.ok ? response.json() : null))
        .then((data) => {

          state.selectedBriefingId = cardId;
          state.selectedBriefingCard = card;

    function percentileWindowStats(metric) {
      const stats = metric?.percentiles;
      if (!stats) return null;
      const windowStats = stats.y10 || stats.all;
      if (!windowStats || typeof windowStats.pct !== "number") return null;
      return windowStats;
    }

    function percentileBadge(metric) {
      const windowStats = percentileWindowStats(metric);
      if (!windowStats) return "";
      const pct = windowStats.pct;
      const cls = pct >= 80 ? "pct-high" : pct <= 20 ? "pct-low" : "pct-mid";
      return `<span class="pct-badge ${cls}" title="${escapeHtml(t("percentile10y"))}">${Math.round(pct)}%</span>`;
    }

    function percentileDetailStats(metric) {
      const stats = metric?.percentiles;
      if (!stats) return "";
      const windowStats = stats.y10 || stats.all;
      const allStats = stats.all;
      let html = "";
      if (windowStats && typeof windowStats.pct === "number") {
        html += detailStat(t("percentile10y"), `${Math.round(windowStats.pct)}%`);
      }
      if (allStats && typeof allStats.min === "number" && typeof allStats.max === "number") {
        html += detailStat(t("fullRange"), `${formatAxisValue(allStats.min)} ~ ${formatAxisValue(allStats.max)}`);
      }
      if (allStats?.from) {
        html += detailStat(t("dataSince"), dateText(String(allStats.from).slice(0, 7)));
      }
      return html;
    }

    function detailBandStats(metric) {
      const stats = metric?.percentiles?.y10 || metric?.percentiles?.all;
      if (!stats) return null;
      const scale = state.currency === "krw" ? dollarUnitScale(metric || {}) : null;
      const factor = scale ? scale.scale : 1;
      const p20 = Number(stats.p20);
      const p80 = Number(stats.p80);
      const median = Number(stats.median);
      if (![p20, p80, median].every(Number.isFinite)) return null;
      return { p20: p20 * factor, p80: p80 * factor, median: median * factor };
    }

      return "heat-cold";

    function clampGaugeScore(value) {

    function recessionDiagnosisState(recession) {
      const alerts = Math.max(0, Number(recession?.alert_count || 0));

      const score = clampGaugeScore(alerts * 46 + warnings * 14);
      if (alerts > 0) {

      if (warnings > 0) {

    function ensureGaugeHistory() {
      if (state.gaugeHistoryData) return Promise.resolve(state.gaugeHistoryData);
      if (!gaugeHistoryPromise) {
        gaugeHistoryPromise = fetch("data/market_gauges_history.json")
          .then((response) => (response.ok ? response.json() : { snapshots: [] }))
          .catch(() => ({ snapshots: [] }))
          .then((data) => {
            state.gaugeHistoryData = data && typeof data === "object" ? data : { snapshots: [] };
            return state.gaugeHistoryData;
          });
      }
      return gaugeHistoryPromise;
    }

    function gaugeHistorySnapshots() {
      return Array.isArray(state.gaugeHistoryData?.snapshots) ? state.gaugeHistoryData.snapshots : [];
    }

    function gaugeHistoryRange(key) {
      return state.gaugeHistoryRange[key] || "3m";
    }

    function gaugeHistoryPointForSnapshot(snapshot, key) {
      if (key === "thermometer") {
        const score = Number(snapshot?.thermometer?.score);
        if (!Number.isFinite(score)) return null;
        return { date: snapshot.date, value: score, label: localizedText(snapshot.thermometer?.label || "") };
      }
      if (key === "recession") {
        const value = Number(snapshot?.recession?.alert_count || 0);
        if (!Number.isFinite(value)) return null;
        return { date: snapshot.date, value, label: localizedText(snapshot.recession?.summary || "") };
      }
      if (key.startsWith("fear_greed::")) {
        const name = key.slice("fear_greed::".length);
        const item = (snapshot?.fear_greed?.items || []).find((entry) => entry?.name === name);
        const score = Number(item?.score);
        if (!Number.isFinite(score)) return null;
        return { date: snapshot.date, value: score, label: localizedText(item?.label || "") };
      }
      return null;
    }

    function gaugeHistorySeries(key) {
      const points = gaugeHistorySnapshots()
        .map((snapshot) => gaugeHistoryPointForSnapshot(snapshot, key))
        .filter((point) => point && point.date)
        .sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const range = gaugeHistoryRange(key);
      if (range === "all" || points.length < 2) return points;
      const latest = chartTimeValue(points[points.length - 1]);
      const months = range === "1y" ? 12 : 3;
      const cutoff = latest - months * 31 * 24 * 60 * 60 * 1000;
      return points.filter((point) => chartTimeValue(point) >= cutoff);
    }

    function gaugeHistoryChart(points, scoreChart = true) {
      if (!points.length) {
        return `<div class="gauge-history-empty">${escapeHtml(t("gaugeHistoryEmpty"))}</div>`;
      }
      const width = 360;
      const height = 150;
      const left = 34;
      const right = 352;
      const top = 12;
      const bottom = 116;
      const labelBottom = 140;
      const times = points.map(chartTimeValue).filter(Number.isFinite);
      const minTime = Math.min(...times);
      const maxTime = Math.max(...times);
      const values = points.map((point) => point.value).filter(Number.isFinite);
      const min = scoreChart ? 0 : 0;
      const max = scoreChart ? 100 : Math.max(1, ...values);
      const span = max - min || 1;
      const xFor = (point, index) => {
        if (minTime === maxTime) return (left + right) / 2;
        const time = chartTimeValue(point);
        return left + ((time - minTime) / (maxTime - minTime)) * (right - left);
      };
      const yFor = (value) => bottom - ((value - min) / span) * (bottom - top);
      const linePoints = scoreChart
        ? points.map((point, index) => `${xFor(point, index).toFixed(1)},${yFor(point.value).toFixed(1)}`).join(" ")
        : points.map((point, index) => {
            const x = xFor(point, index).toFixed(1);
            const y = yFor(point.value).toFixed(1);
            if (index === 0) return `${x},${y}`;
            const prevX = xFor(points[index - 1], index - 1).toFixed(1);
            return `${prevX},${y} ${x},${y}`;
          }).join(" ");
      const bands = scoreChart ? [
        { y1: yFor(100), y2: yFor(75), cls: "band-high" },
        { y1: yFor(75), y2: yFor(55), cls: "band-mid" },
        { y1: yFor(55), y2: yFor(45), cls: "band-low" },
        { y1: yFor(45), y2: yFor(25), cls: "band-mid" },
        { y1: yFor(25), y2: yFor(0), cls: "band-low" }
      ].map((band) => `<rect class="gauge-history-band ${band.cls}" x="${left}" y="${band.y1.toFixed(1)}" width="${right - left}" height="${(band.y2 - band.y1).toFixed(1)}"></rect>`).join("") : "";
      const tickCandidates = points.length > 2 ? [points[0], points[Math.floor(points.length / 2)], points[points.length - 1]] : points;
      const xLabels = tickCandidates.map((point, index) => {
        const x = xFor(point, index);
        const anchor = x <= left + 4 ? "start" : x >= right - 4 ? "end" : "middle";
        return `<text class="gauge-history-label" x="${x.toFixed(1)}" y="${labelBottom}" text-anchor="${anchor}">${escapeHtml(dateText(point.date))}</text>`;
      }).join("");
      const yLabels = [min, max].map((value) => `
        <text class="gauge-history-label" x="${left - 8}" y="${yFor(value).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${escapeHtml(formatAxisValue(value))}</text>
        <line class="gauge-history-grid" x1="${left}" y1="${yFor(value).toFixed(1)}" x2="${right}" y2="${yFor(value).toFixed(1)}"></line>
      `).join("");
      const dots = points.map((point, index) => {
        const valueLabel = scoreChart ? `${numberText(point.value)} · ${localizedText(point.label || "")}` : `${numberText(point.value)} ${state.language === "en" ? "signals" : "개"}`;
        return `<circle class="gauge-history-point" cx="${xFor(point, index).toFixed(1)}" cy="${yFor(point.value).toFixed(1)}" r="3.5">
          <title>${escapeHtml(`${dateText(point.date)} ${valueLabel}`)}</title>
        </circle>`;
      }).join("");
      return `<div class="gauge-history-chart">
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(t("gaugeHistory"))}">
          ${bands}
          ${yLabels}
          <line class="gauge-history-axis" x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"></line>
          ${xLabels}
          <polyline class="gauge-history-line" points="${linePoints}"></polyline>
          ${dots}
        </svg>
      </div>`;
    }

    function gaugeHistoryPanelMarkup(key, title, scoreChart = true) {
      if (!state.gaugeHistoryOpen[key]) return "";
      const loaded = Boolean(state.gaugeHistoryData);
      const points = loaded ? gaugeHistorySeries(key) : [];
      const range = gaugeHistoryRange(key);
      return `<div class="gauge-history-panel">
        <div class="gauge-history-toolbar">
          <span class="gauge-history-title">${escapeHtml(title)}</span>
          <span class="gauge-history-ranges">
            ${["3m", "1y", "all"].map((item) => `<button class="gauge-history-range${range === item ? " is-active" : ""}" type="button" data-gauge-history-range="${escapeHtml(key)}" data-range="${item}">${escapeHtml(t(item === "3m" ? "gaugeHistory3m" : item === "1y" ? "gaugeHistory1y" : "gaugeHistoryAll"))}</button>`).join("")}
          </span>
        </div>
        ${loaded ? gaugeHistoryChart(points, scoreChart) : `<div class="gauge-history-empty">${escapeHtml(t("gaugeHistoryLoading"))}</div>`}
      </div>`;
    }

      const thermoScore = clampGaugeScore(thermo?.score);

        </div>
        <div class="gauge-main-area">

          ${gaugeTrackMarkup(thermoScore)}
          <p class="gauge-comment">${escapeHtml(localizedText(thermo.comment || ""))}</p>
        </div>
        ${gaugeBasisMarkup(thermo.components || [], gaugeComponentMarkup)}
        ${gaugeHistoryPanelMarkup("thermometer", t("marketThermometer"), true)}
      </div>` : "";
      const recessionHtml = recession ? `<div class="gauge-card recession-card">

      const fearGreedHtml = fearGreed?.items?.length ? `<div class="gauge-card fear-greed-card">
        <div class="gauge-card-head">
          <h3>${escapeHtml(t("fearGreedIndex"))}</h3>
          <span class="gauge-card-actions">${gaugeStatusBadgeMarkup(fearGreedState.status, fearGreedState.score)}</span>
        </div>
        <div class="gauge-main-area fear-greed-main-area">
          <ul class="fear-greed-gauge-list">${fearGreed.items.map(fearGreedGaugeMarkup).join("")}</ul>
          <p class="gauge-comment">${escapeHtml(localizedText(fearGreed.comment || ""))}</p>
        </div>
        ${fearGreedPanels}
      </div>` : "";
      return `<section class="market-diagnosis">
        <div class="market-diagnosis-head">

        </div>
        <div class="market-gauges">${thermoHtml}${recessionHtml}${fearGreedHtml}</div>
