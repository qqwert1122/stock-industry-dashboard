<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>산업별 지표 대시보드</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --sidebar: #f7f7f7;
      --panel: #ffffff;
      --text: #171717;
      --muted: #6d6d6d;
      --line: #e6e6e6;
      --menu: #f0f0f0;
      --menu-active: #e6e6e6;
      --detail-stat-bg: #f8f8f8;
      --branch-line: #e0e0e0;
      --ai-card-bg: linear-gradient(135deg, rgba(6, 182, 212, 0.06) 0%, rgba(59, 130, 246, 0.08) 48%, rgba(79, 70, 229, 0.10) 100%);
      --ai-card-border: rgba(59, 130, 246, 0.12);
      --ai-inset-bg: rgba(255, 255, 255, 0.46);
      --ai-inset-border: rgba(59, 130, 246, 0.10);
      --ai-bullet-text: #7a7a7a;
      --ai-bullet-body: #9a9a9a;
      --favorite-star: #f59e0b;
      --chart-up: #f23645;
      --chart-down: #1f5eff;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      --menu-shadow: 0 7px 18px rgba(0, 0, 0, 0.045);
    }

    body.theme-dark {
      color-scheme: dark;
      --bg: #111111;
      --surface: #151515;
      --sidebar: #181818;
      --panel: #1d1d1d;
      --text: #f2f2f2;
      --muted: #a7a7a7;
      --line: #303030;
      --menu: #242424;
      --menu-active: #303030;
      --detail-stat-bg: #1a1a1a;
      --branch-line: #3c3c3c;
      --ai-card-bg: linear-gradient(135deg, rgba(6, 182, 212, 0.10) 0%, rgba(59, 130, 246, 0.12) 48%, rgba(79, 70, 229, 0.14) 100%);
      --ai-card-border: rgba(96, 165, 250, 0.18);
      --ai-inset-bg: rgba(255, 255, 255, 0.045);
      --ai-inset-border: rgba(96, 165, 250, 0.12);
      --ai-bullet-text: #a8a8a8;
      --ai-bullet-body: #898989;
      --favorite-star: #fbbf24;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      --menu-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body.theme-ready {
      transition: background-color 520ms ease, color 520ms ease;
    }

    body.theme-ready .sidebar,
    body.theme-ready .side-menu button,
    body.theme-ready .menu-item,
    body.theme-ready .mobile-menu-toggle,
    body.theme-ready .drawer-close,
    body.theme-ready .drawer-backdrop,
    body.theme-ready .settings-button,
    body.theme-ready .settings-menu,
    body.theme-ready .settings-menu button,
    body.theme-ready .reorder-actions button,
    body.theme-ready .currency-toggle,
    body.theme-ready .theme-toggle,
    body.theme-ready .scroll-top-button,
    body.theme-ready .industry,
    body.theme-ready .industry-head,
    body.theme-ready .industry-icon-wrap,
    body.theme-ready .group,
    body.theme-ready .metric,
    body.theme-ready .metric-table-wrap,
    body.theme-ready .metric-table th,
    body.theme-ready .metric-table td,
    body.theme-ready .metric-toggle,
    body.theme-ready .metric-detail-panel,
    body.theme-ready .detail-stats,
    body.theme-ready .detail-stat,
    body.theme-ready .chart,
    body.theme-ready .empty {
      transition:
        background-color 520ms ease,
        border-color 520ms ease,
        box-shadow 520ms ease,
        color 520ms ease;
    }

    body.theme-ready .chart text,
    body.theme-ready .axis-line,
    body.theme-ready .guide,
    body.theme-ready .trend-line,
    body.theme-ready .current-dot {
      transition: fill 520ms ease, stroke 520ms ease;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 26px;
      width: min(1540px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 24px 42px;
    }

    .sidebar {
      position: sticky;
      top: 22px;
      align-self: start;
      min-width: 0;
      height: calc(100vh - 44px);
      max-height: calc(100vh - 44px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      gap: 12px;
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: var(--sidebar);
      box-shadow: var(--menu-shadow);
      overflow: visible;
    }

    .side-menu {
      display: grid;
      gap: 7px;
      min-width: 0;
      max-width: 100%;
      min-height: 0;
      align-content: start;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      user-select: none;
    }

    .side-menu::-webkit-scrollbar {
      display: none;
    }

    .side-menu.is-drag-scrolling {
      cursor: grabbing;
    }

    .side-menu.is-drag-scrolling * {
      cursor: grabbing !important;
    }

    .menu-item {
      position: relative;
      min-width: 0;
      border-radius: 12px;
    }

    .side-menu button {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      padding: 0 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 720;
      cursor: pointer;
    }

    .sidebar.is-reordering .side-menu button {
      padding-right: 36px;
      cursor: grab;
    }

    .side-menu button:hover {
      background: var(--menu);
    }

    .side-menu button[aria-pressed="true"] {
      color: var(--text);
    }

    .side-menu button[aria-current="true"] {
      background: var(--menu-active);
      color: var(--text);
    }

    .menu-depth-list {
      display: grid;
      gap: 3px;
      margin: 4px 0 6px 6px;
      padding-left: 4px;
    }

    .menu-depth-item {
      min-width: 0;
    }

    .side-menu .menu-depth-button {
      min-height: 31px;
      border-radius: 10px;
      padding: 0 10px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }

    .side-menu .menu-depth-button[aria-current="true"] {
      color: var(--text);
      background: var(--menu-active);
    }

    .sidebar.is-reordering .menu-depth-list {
      display: none;
    }

    .drawer-head,
    .mobile-menu-toggle,
    .drawer-backdrop {
      display: none;
    }

    .drawer-close,
    .mobile-menu-toggle {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      display: none;
      place-items: center;
      background: var(--menu);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      box-shadow: var(--menu-shadow);
    }

    .drawer-close:hover,
    .mobile-menu-toggle:hover {
      background: var(--menu-active);
    }

    .drawer-close:focus-visible,
    .mobile-menu-toggle:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .drag-handle {
      position: absolute;
      right: 10px;
      top: 19px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 180ms ease;
    }

    .sidebar.is-reordering .drag-handle {
      opacity: 1;
      pointer-events: auto;
      cursor: grab;
    }

    .menu-item.is-dragging {
      opacity: 0.45;
    }

    .menu-settings {
      position: relative;
      display: grid;
      gap: 8px;
    }

    .settings-button,
    .settings-menu button,
    .reorder-actions button {
      min-width: 0;
      border: 0;
      cursor: pointer;
    }

    .settings-button {
      min-height: 40px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 14px;
      gap: 8px;
      align-items: center;
      padding: 0 12px;
      background: var(--menu);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      text-align: left;
    }

    .settings-button:hover,
    .settings-button[aria-expanded="true"] {
      background: var(--menu-active);
    }

    .settings-chevron {
      color: var(--muted);
      font-size: 11px;
      transition: transform 180ms ease;
    }

    .settings-button[aria-expanded="true"] .settings-chevron {
      transform: rotate(180deg);
    }

    .settings-menu {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 8px);
      z-index: 20;
      display: grid;
      gap: 5px;
      padding: 7px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--menu-shadow);
    }

    .settings-menu[hidden],
    .reorder-actions[hidden] {
      display: none;
    }

    .settings-menu button {
      min-height: 36px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 0 9px;
      background: transparent;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 400;
      text-align: left;
    }

    .settings-menu button:hover {
      background: var(--menu);
    }

    .settings-meta {
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .reorder-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .reorder-actions button {
      min-height: 38px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 780;
    }

    .reorder-cancel {
      background: var(--menu);
      color: var(--text);
    }

    .reorder-save {
      background: var(--chart-down);
      color: #ffffff;
    }

    .content {
      min-width: 0;
      display: grid;
      gap: 20px;
      align-content: start;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 46px;
    }

    .title-wrap {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .last-updated-inline {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      font-weight: 400;
      opacity: 0.72;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.2vw, 30px);
      line-height: 1.12;
      font-weight: 810;
    }

    .currency-toggle,
    .theme-toggle {
      min-width: 94px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 24px;
      display: inline-grid;
      grid-template-columns: 20px auto 18px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: relative;
      background: var(--menu);
      color: var(--text);
      cursor: pointer;
      padding: 0 11px;
      font-size: 13px;
      font-weight: 400;
    }

    .scroll-top-button {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 58;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      background: var(--menu);
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      box-shadow: var(--menu-shadow);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(10px);
    }

    body.theme-ready .scroll-top-button {
      transition:
        background-color 520ms ease,
        border-color 520ms ease,
        box-shadow 520ms ease,
        color 520ms ease,
        opacity 180ms ease,
        transform 180ms ease,
        visibility 180ms ease;
    }

    body.show-scroll-top .scroll-top-button {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .currency-toggle:hover,
    .theme-toggle:hover,
    .scroll-top-button:hover {
      background: var(--menu-active);
    }

    .currency-toggle:focus-visible,
    .theme-toggle:focus-visible,
    .scroll-top-button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .toggle-label {
      min-width: 0;
      white-space: nowrap;
      line-height: 1;
      transform: translateY(0);
    }

    .toggle-chevron {
      width: 16px;
      height: 16px;
      color: var(--muted);
      stroke-width: 2;
    }

    .currency-icon-slot,
    .theme-icon-orbit {
      position: relative;
      width: 20px;
      height: 20px;
      display: block;
      overflow: hidden;
      font-size: 16px;
    }

    .currency-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translate(-50%, -50%) translateY(-15px);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    body.currency-usd .currency-icon-dollar,
    body.currency-krw .currency-icon-won {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0);
    }

    body.currency-usd .currency-icon-won,
    body.currency-krw .currency-icon-dollar {
      opacity: 0;
      transform: translate(-50%, -50%) translateY(-15px);
    }

    .theme-toggle:disabled {
      cursor: default;
    }

    .theme-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1em;
      height: 1em;
      display: grid;
      place-items: center;
      color: currentColor;
      opacity: 0;
      transform: translate(-50%, -50%) translateY(-15px);
      transform-origin: center;
      pointer-events: none;
    }

    body:not(.theme-dark) .theme-icon-sun,
    body.theme-dark .theme-icon-moon {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0);
    }

    body:not(.theme-dark) .theme-icon-moon,
    body.theme-dark .theme-icon-sun {
      opacity: 0;
      transform: translate(-50%, -50%) translateY(-15px);
    }

    .toggle-label.is-exiting {
      animation: toggleLabelExit 240ms ease forwards;
    }

    .toggle-label.is-entering {
      animation: toggleLabelEnter 300ms ease forwards;
    }

    .currency-icon.is-exiting,
    .theme-icon.is-exiting {
      animation: toggleIconExit 240ms ease forwards;
    }

    .currency-icon.is-entering,
    .theme-icon.is-entering {
      animation: toggleIconEnter 300ms ease forwards;
    }

    @keyframes toggleLabelExit {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(14px);
      }
    }

    @keyframes toggleLabelEnter {
      0% {
        opacity: 0;
        transform: translateY(-14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toggleIconExit {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(15px);
      }
    }

    @keyframes toggleIconEnter {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-15px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body.theme-ready,
      body.theme-ready .sidebar,
      body.theme-ready .side-menu button,
      body.theme-ready .menu-item,
      body.theme-ready .mobile-menu-toggle,
      body.theme-ready .drawer-close,
      body.theme-ready .drawer-backdrop,
      body.theme-ready .settings-button,
      body.theme-ready .settings-menu,
      body.theme-ready .settings-menu button,
      body.theme-ready .reorder-actions button,
      body.theme-ready .currency-toggle,
      body.theme-ready .theme-toggle,
      body.theme-ready .scroll-top-button,
      body.theme-ready .industry,
      body.theme-ready .industry-head,
      body.theme-ready .industry-icon-wrap,
      body.theme-ready .group,
      body.theme-ready .metric,
      body.theme-ready .metric-table-wrap,
      body.theme-ready .metric-table th,
      body.theme-ready .metric-table td,
      body.theme-ready .metric-toggle,
      body.theme-ready .metric-detail-panel,
      body.theme-ready .detail-stats,
      body.theme-ready .detail-stat,
      body.theme-ready .chart,
      body.theme-ready .empty,
      body.theme-ready .chart text,
      body.theme-ready .axis-line,
      body.theme-ready .guide,
      body.theme-ready .trend-line,
      body.theme-ready .current-dot {
        transition-duration: 1ms;
      }

      .toggle-label.is-exiting,
      .toggle-label.is-entering,
      .currency-icon.is-exiting,
      .currency-icon.is-entering,
      .theme-icon.is-exiting,
      .theme-icon.is-entering {
        animation-duration: 1ms;
      }
    }

    .industry-stack {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .daily-updates {
      min-width: 0;
      margin: 4px 0 18px;
    }

    .morning-briefing {
      position: relative;
      min-width: 0;
      display: grid;
      gap: 16px;
      margin: 0 0 18px;
      padding: 16px;
      border: 1px solid var(--ai-card-border);
      border-radius: 24px;
      background: var(--ai-card-bg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .morning-briefing-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .morning-briefing h2,
    .morning-briefing h3 {
      margin: 0;
    }

    .morning-briefing h2 {
      font-size: 17px;
      line-height: 1.2;
      font-weight: 760;
    }

    .briefing-title {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .ai-sparkle-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      overflow: visible;
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.18));
      animation: aiSparklePulse 1800ms ease-in-out infinite;
    }

    .ai-sparkle-icon path {
      fill: url(#aiSparkleGradient);
    }

    @keyframes aiSparklePulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.07);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ai-sparkle-icon {
        animation: none;
      }
    }

    .briefing-meta {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-radius: 999px;
      background: var(--ai-inset-bg);
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      border: 1px solid var(--ai-inset-border);
    }

    .briefing-headline {
      margin: 0;
      font-size: 17px;
      line-height: 1.32;
      font-weight: 760;
    }

    .briefing-summary {
      margin: -2px 0 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .briefing-bullets {
      min-width: 0;
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0 0 0 18px;
    }

    .briefing-bullet {
      min-width: 0;
      padding-left: 2px;
      color: var(--ai-bullet-text);
    }

    .briefing-bullet::marker {
      color: var(--ai-bullet-text);
      font-size: 0.9em;
    }

    .briefing-bullet-button,
    .briefing-bullet-static {
      display: block;
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--ai-bullet-text);
      padding: 0;
      text-align: left;
    }

    .briefing-bullet-button {
      cursor: pointer;
    }

    .briefing-bullet-button:hover .briefing-bullet-title {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .briefing-bullet-title {
      display: inline;
      margin-right: 5px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
    }

    .briefing-bullet-body {
      display: inline;
      color: var(--ai-bullet-body);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .briefing-disclaimer {
      margin: -2px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--ai-inset-border);
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .briefing-disclaimer-icon {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--menu);
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
    }

    .favorite-metrics {
      min-width: 0;
      display: grid;
      gap: 16px;
      margin: 46px 0 30px;
      padding-bottom: 12px;
    }

    .favorite-metrics-head {

    .negative { color: var(--chart-down) !important; }

    .chart {
      width: 100%;
      height: 158px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: visible;
    }

    .chart.chart-mini,
    .chart.detail-chart-axis,
    .detail-chart-scroll .chart.chart-detail {
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .chart text {
      fill: var(--muted);
      font-size: 10.5px;
      font-weight: 400;
    }

    .chart text.level-max {
      fill: var(--chart-down);
    }

    .chart text.level-min {
      fill: var(--chart-up);
    }

    .chart text.level-current {
      fill: var(--text);
    }

    .axis-line {
      stroke: var(--line);
      stroke-width: 1;
    }

    .guide {
      stroke: var(--line);
      stroke-width: 0.7;
      stroke-dasharray: 4 4;
    }

    .chart-background-line {
      stroke: var(--line);
      stroke-width: 0.55;
      stroke-dasharray: 3 5;
      opacity: 0.44;
    }

    .chart-background-line.level-line {
      opacity: 0.92;
      stroke-width: 0.7;
      stroke-dasharray: 4 5;
    }

    .chart-background-line.level-max {
      stroke: var(--chart-down);
    }

    .chart-background-line.level-min {
      stroke: var(--chart-up);
    }

    .chart-background-line.level-current {
      stroke: var(--text);
      stroke-width: 1.5;
    }

    .trend-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trend-line.up { stroke: var(--chart-up); }
    .trend-line.down { stroke: var(--chart-down); }

    .current-dot.up { fill: var(--chart-up); }
    .current-dot.down { fill: var(--chart-down); }

    .detail-point-hit {
      cursor: crosshair;
      pointer-events: all;
    }

    .empty {
      display: none;
      margin: 28px 0;
      padding: 26px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1180px) {
      .shell {
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 18px;
        padding-inline: 18px;
      }

      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      body {
        font-size: 15px;
      }

      .shell {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 14px 10px 30px;
      }

      body.drawer-open {
        overflow: hidden;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 70;
        width: min(320px, calc(100vw - 54px));
        max-width: calc(100vw - 54px);
        height: 100dvh;
        max-height: 100dvh;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        padding: 14px;
        border-radius: 0 20px 20px 0;
        overflow: visible;
        transform: translateX(calc(-100% - 24px));
        transition: transform 260ms ease;
      }

      body.drawer-open .sidebar {
        transform: translateX(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        padding: 2px 0 4px;
        font-size: 15px;
        font-weight: 820;
      }

      .drawer-close,
      .mobile-menu-toggle {
        display: grid;
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        border: 1px solid var(--line);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: block;
        background: rgba(18, 18, 18, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .drawer-backdrop[hidden] {
        display: none;
      }

      body.drawer-open .drawer-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      .side-menu {
        display: grid;
        gap: 7px;
        max-width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 0 2px 0 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .side-menu button {
        width: 100%;
        white-space: normal;
      }

      .sidebar.is-reordering .side-menu button {
        padding-right: 34px;
      }

      .settings-menu {
        position: static;
        order: -1;
      }

      .reorder-actions {
        grid-template-columns: 1fr 1fr;
      }

      .topbar {
        position: relative;
        z-index: 1;
        display: block;
        min-height: 90px;
        margin: 0;
        padding: 56px 0 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .mobile-menu-toggle {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        top: max(10px, env(safe-area-inset-top));
        z-index: 58;
      }

      .topbar-actions {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        top: max(10px, env(safe-area-inset-top));
        z-index: 58;
        gap: 7px;
      }

      .currency-toggle,
      .theme-toggle {
        min-width: 84px;
        width: auto;
        height: 46px;
        grid-template-columns: 19px auto 15px;
        gap: 5px;
        padding: 0 10px;
        border-radius: 24px;
        font-size: 13px;
      }

      .scroll-top-button {
        right: max(14px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 46px;
        height: 46px;
        font-size: 16px;
      }

      .currency-toggle .toggle-label,
      .theme-toggle .toggle-label {
        display: inline;
      }

      .currency-icon-slot,
      .theme-icon-orbit {
        width: 18px;
        height: 18px;
        font-size: 15px;
      }

      .toggle-chevron {
        width: 14px;
        height: 14px;
      }

      h1 {
        min-width: 0;
        font-size: clamp(20px, 5.6vw, 24px);
      }

      .title-wrap {
        gap: 6px 9px;
      }

      .last-updated-inline {
        font-size: 11.5px;
      }

      .daily-updates {
        margin: 0 0 14px;
      }

      .morning-briefing {
        gap: 13px;
        margin-bottom: 12px;
        padding: 13px;
      }

      .morning-briefing-head {
        align-items: center;
        gap: 8px;
      }

      .morning-briefing h2 {
        font-size: 17px;
      }

      .briefing-meta {
        font-size: 11px;
      }

      .briefing-headline {
        font-size: 16px;
      }

      .briefing-summary,
      .briefing-bullet-body {
        font-size: 12.5px;
      }

      .favorite-metrics {
        gap: 14px;
        margin: 38px 0 24px;
        padding-bottom: 10px;
      }

      .favorite-metrics .favorite-metrics-head h2 {
        font-size: 18px;
      }

      .favorite-metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .favorite-card {
        min-height: 116px;
        padding: 14px;
      }

      .favorite-card-star {
        right: 8px;
        top: 8px;
        width: 28px;
        height: 28px;
        font-size: 12px;
      }

      .favorite-card-value {
        font-size: 15px;
      }

      .daily-updates-head {
        align-items: start;
        padding: 0 2px;
      }

      .daily-updates h2 {
        font-size: 13px;
      }

      .daily-update-summary {
        font-size: 12.5px;
        margin-left: 8px;
        padding: 8px 10px;
      }

      .daily-update-counts {
        gap: 4px;
        font-size: 10.5px;
      }

      .daily-update-count {
        padding: 5px 7px;
      }

      .daily-update-list {
        max-height: 210px;
      }

      .daily-update-row {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 5px 8px;
        padding: 8px 7px;
      }

      .daily-update-main {
        grid-column: 1;
        grid-row: 1;
      }

      .daily-update-value {
        grid-column: 2;
        grid-row: 1;
      }

      .daily-update-meta {
        grid-column: 1;
        grid-row: 2;
        font-size: 10.5px;
      }

      .daily-update-title {
        font-size: 13px;
      }

      .daily-update-value,
      .daily-update-change {
        font-size: 11.5px;
      }

      .daily-update-change {
        grid-column: 2;
        grid-row: 2;
        align-self: center;
        gap: 3px;
      }

      .industry-head {
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 12px;
        padding: 18px 0 12px;
      }

      .industry-icon-wrap {
        width: 80px;
        height: 80px;
      }

      .industry-icon {
        width: 74px;
        height: 74px;
      }

      .industry h2 {
        font-size: 20px;
      }

      .group { padding: 0 0 18px; }

      .depth-section .group-title,
      .group-title {
        margin: 12px 0 10px 8px;
        font-size: 16px;
      }

      .depth-title {
        margin: 18px 0 8px;
        font-size: 16px;
      }

      .depth-tree {
        --depth-content-left: 42px;
        --depth-line-left: 8px;
        --depth-corner-gap: 14px;
        --depth-corner-height: 15px;
      }

      .depth-tree::before {
        left: var(--depth-line-left);
      }

      .depth-section {
        margin-left: 0;
        padding-left: 0;
      }

      .depth-title::before {
        border-bottom-left-radius: 16px;
      }

      .metric-table-wrap {
        overflow-x: visible;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
      }

      .metric-table {
        display: table;
        width: 100%;
        min-width: 0;
        table-layout: fixed;
      }

      .metric-table thead {
        display: table-header-group;
      }

      .metric-table tbody {
        display: table-row-group;
      }

      .metric-table tr {
        display: table-row;
      }

      .metric-table td {
        display: table-cell;
      }

      .metric-table col.metric-description-cell,
      .metric-table col.metric-date-cell,
      .metric-table th:nth-child(2),
      .metric-table th:nth-child(3),
      .metric-table td.metric-description-cell,
      .metric-table td.metric-date-cell {
        display: none;
      }

      .metric-table th[data-mobile-label] {
        font-size: 0;
      }

      .metric-table th[data-mobile-label]::after {
        content: attr(data-mobile-label);
        font-size: 10.5px;
      }

      .metric-row {
        padding: 0;
        border-top: 0;
      }

      .metric-row:first-child {
        border-top: 0;
      }

      .metric-row td {
        padding: 7px 6px;
        border-top: 1px solid var(--line);
      }

      .metric-row td:not(.metric-name-cell)::before {
        content: none;
      }

      .metric-name-cell { width: 42%; }
      .metric-value-cell { width: 24%; }
      .metric-chart-cell { width: 25%; }
      .metric-favorite-cell { width: 9%; }

      .metric-name {
        font-size: 13.5px;
        line-height: 1.22;
      }

      .metric-mobile-description {
        display: -webkit-box;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.28;
        font-weight: 580;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .metric-current-value {
        font-size: 12.5px;
        line-height: 1.2;
      }

      .metric-value-wrap {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .metric-change-badge {
        font-size: 11px;
      }

      .metric-chart-cell .chart-mini {
        height: 30px;
        max-height: 30px;
      }

      .metric-favorite-button {
        width: 34px;
        height: 34px;
        font-size: 13.5px;
      }

      .metric-detail-row td {
        padding: 0 6px;
      }

      .metric-detail-inner {
        gap: 8px;
        padding: 10px 0 12px;
      }

      .detail-chart {
        grid-template-columns: 40px minmax(0, 1fr);
        overflow: hidden;
        padding: 0 0 6px;
      }

      .detail-chart-axis {
        width: 40px;
        min-width: 40px;
        height: 158px;
      }

      .detail-chart-scroll .chart {
        width: max(100%, var(--detail-chart-width, 520px));
        min-width: max(100%, var(--detail-chart-width, 520px));
        height: 158px;
      }

      .detail-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        padding: 0;
      }

      .detail-stat {
        padding: 9px 8px;
        border-radius: 14px;
      }

      .detail-label {
        font-size: 10.5px;
        line-height: 1.12;
      }

      .detail-value {
        margin-top: 3px;
        font-size: 13px;
        line-height: 1.12;
      }

      .detail-chart-legend {
        font-size: 11.5px;
      }

      .metric-grid { grid-template-columns: 1fr; }
      .metric-main { grid-template-columns: 1fr; }
      .deltas {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        text-align: left;
      }
    }

    /* ---------- 시장 온도계 / 침체 시그널 / 백분위 ---------- */
    .market-gauges {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      margin: 0 0 18px;
    }
    .gauge-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .gauge-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .gauge-card-head h3 { margin: 0; font-size: 15px; }
    .thermometer-score {
      font-weight: 700;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--menu);
      white-space: nowrap;
    }
    .thermometer-score.heat-hot { background: rgba(239, 68, 68, 0.14); color: #dc2626; }
    .thermometer-score.heat-warm { background: rgba(249, 115, 22, 0.14); color: #ea580c; }
    .thermometer-score.heat-neutral { background: rgba(234, 179, 8, 0.16); color: #a16207; }
    .thermometer-score.heat-cool { background: rgba(59, 130, 246, 0.13); color: #2563eb; }
    .thermometer-score.heat-cold { background: rgba(29, 78, 216, 0.15); color: #1d4ed8; }
    .thermometer-track {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6, #eab308, #f97316, #ef4444);
    }
    .thermometer-marker {
      position: absolute;
      top: -4px;
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: var(--text);
      transform: translateX(-2px);
      box-shadow: 0 0 0 2px var(--panel);
    }
    .gauge-main-area { min-height: 72px; }
    .gauge-comment { margin: 12px 0 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
    .gauge-basis { margin-top: 12px; font-size: 12px; }
    .gauge-basis-title {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }
    .gauge-component-list {
      position: relative;
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
    }
    .gauge-component-list.is-dragging {
      cursor: grabbing;
      user-select: none;
    }
    .gauge-component-list.is-dragging button {
      cursor: grabbing;
    }
    .gauge-component-list::-webkit-scrollbar {
      display: none;
    }
    .gauge-component-list li {
      flex: 0 0 168px;
    }
    .gauge-component-list button,
    .gauge-component-static,
    .signal-chip {
      width: 100%;
      min-height: 88px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      gap: 5px;
      background: var(--menu);
      border: none;
      border-radius: 24px;
      padding: 12px;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      text-align: left;
    }
    .gauge-component-static,
    .signal-chip-static { cursor: default; }
    .gauge-component-name {
      min-width: 0;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gauge-component-value {
      color: #111827;
      font-size: 15px;
      line-height: 1.1;
      font-weight: 560;
      overflow-wrap: anywhere;
    }
    body.theme-dark .gauge-component-value { color: var(--text); }
    .gauge-component-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      font-weight: 420;
      width: 100%;
    }
    .gauge-trend-icon {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      stroke: currentColor;
    }
    .gauge-component-change.positive { color: var(--chart-up) !important; }
    .gauge-component-change.negative { color: var(--chart-down) !important; }
    .gauge-component-heat { color: var(--muted); font-size: 10.5px; line-height: 1.25; width: 100%; }
    .signal-chip .signal-value { font-weight: 560; font-size: 15px; }
    .pct-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--menu);
      color: var(--muted);
      white-space: nowrap;
    }
    .pct-badge.pct-high { background: rgba(239, 68, 68, 0.12); color: #dc2626; }
    .pct-badge.pct-low { background: rgba(59, 130, 246, 0.12); color: #2563eb; }
    .metric-stale-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      color: #b45309;
      white-space: nowrap;
    }
    .pct-band { fill: rgba(59, 130, 246, 0.08); }
    body.theme-dark .pct-band { fill: rgba(96, 165, 250, 0.1); }
    .pct-band-median { stroke: rgba(59, 130, 246, 0.55); stroke-width: 1; stroke-dasharray: 4 4; }
    .detail-range-toggle { display: flex; gap: 6px; margin: 10px 0 0; }
    .detail-range-toggle[hidden] { display: none; }
    .detail-range-toggle button {
      border: 1px solid var(--line);
      background: var(--menu);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
    }
    .detail-range-toggle button.is-active { background: var(--menu-active); color: var(--text); font-weight: 700; }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar" id="mobileDrawer" aria-label="업종 메뉴">
      <div class="drawer-head">
        <span data-i18n="drawerTitle">메뉴</span>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="메뉴 닫기">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <nav class="side-menu" id="industryFilters" aria-label="업종 메뉴"></nav>
      <div class="menu-settings" id="menuSettings">
        <div class="settings-menu" id="settingsMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-setting-action="theme">
            <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
            <span data-i18n="darkMode">다크모드</span>
            <span class="settings-meta" id="themeSettingLabel"></span>
          </button>
          <button type="button" role="menuitem" data-setting-action="language">
            <i class="fa-solid fa-language" aria-hidden="true"></i>
            <span data-i18n="language">언어변경</span>
            <span class="settings-meta" id="languageSettingLabel">KO</span>
          </button>
          <button type="button" role="menuitem" data-setting-action="timezone">
            <i class="fa-solid fa-clock" aria-hidden="true"></i>
            <span data-i18n="timeZone">시간대 변경</span>
            <span class="settings-meta" id="timeZoneSettingLabel">한국</span>
          </button>
          <button type="button" role="menuitem" data-setting-action="reorder">
            <i class="fa-solid fa-arrow-up-wide-short" aria-hidden="true"></i>
            <span data-i18n="reorderMenu">메뉴 순서변경</span>
            <span></span>
          </button>
        </div>
        <button class="settings-button" id="settingsToggle" type="button" aria-label="설정" aria-expanded="false" aria-controls="settingsMenu">
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
          <span data-i18n="settings">설정</span>
          <i class="fa-solid fa-chevron-up settings-chevron" aria-hidden="true"></i>
        </button>
      </div>
      <div class="reorder-actions" id="reorderActions" hidden>
        <button class="reorder-cancel" id="reorderCancel" type="button" data-i18n="cancel">취소</button>
        <button class="reorder-save" id="reorderSave" type="button" data-i18n="save">저장</button>
      </div>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <section class="content">
      <header class="topbar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobileDrawer">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

    function t(key) {
      return translations[state.language]?.[key] || translations.ko[key] || key;
