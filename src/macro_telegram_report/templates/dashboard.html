<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>산업별 지표 대시보드</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --sidebar: #f7f7f7;
      --panel: #ffffff;
      --text: #171717;
      --muted: #6d6d6d;
      --line: #e6e6e6;
      --menu: #f0f0f0;
      --menu-active: #e6e6e6;
      --detail-stat-bg: #f8f8f8;
      --branch-line: #e0e0e0;
      --ai-card-bg: linear-gradient(135deg, rgba(6, 182, 212, 0.06) 0%, rgba(59, 130, 246, 0.08) 48%, rgba(79, 70, 229, 0.10) 100%);
      --ai-card-border: rgba(59, 130, 246, 0.12);
      --ai-inset-bg: rgba(255, 255, 255, 0.46);
      --ai-inset-border: rgba(59, 130, 246, 0.10);
      --ai-bullet-text: #7a7a7a;
      --ai-bullet-body: #9a9a9a;
      --favorite-star: #f59e0b;
      --note-accent: #f2b800;
      --chart-up: #f23645;
      --chart-down: #1f5eff;
      --gauge-marker-bg: #f7f7f7;
      --gauge-marker-border: rgba(23, 23, 23, 0.08);
      --gauge-marker-shadow: 0 2px 7px rgba(0, 0, 0, 0.14);
      --gauge-cold: #1f5eff;
      --gauge-cool: #3b82f6;
      --gauge-neutral: #f2b800;
      --gauge-warm: #ff6b4a;
      --gauge-hot: #f23645;
      --gauge-gradient: linear-gradient(90deg, var(--gauge-cold) 0%, #22c55e 34%, var(--gauge-neutral) 66%, var(--gauge-hot) 100%);
      --overview-title-top-gap: 46px;
      --overview-title-top-gap-mobile: 38px;
      --chip-radius: 16px;
      --signal-drawer-bg: #f3f4f6;
      --signal-card-bg: #ffffff;
      --signal-card-muted: #a6afbd;
      --signal-filter-active-bg: #111827;
      --signal-filter-active-text: #ffffff;
      --signal-trigger-bg: #ffe8ee;
      --signal-trigger-text: #f23645;
      --signal-clear-bg: #e8f2ff;
      --signal-clear-text: #1f7aff;
      --signal-backfill-bg: #eceff3;
      --signal-backfill-text: #8b95a3;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      --menu-shadow: 0 7px 18px rgba(0, 0, 0, 0.045);
    }

    body.theme-dark {
      color-scheme: dark;
      --bg: #111111;
      --surface: #151515;
      --sidebar: #181818;
      --panel: #1d1d1d;
      --text: #f2f2f2;
      --muted: #a7a7a7;
      --line: #303030;
      --menu: #242424;
      --menu-active: #303030;
      --detail-stat-bg: #1a1a1a;
      --branch-line: #3c3c3c;
      --ai-card-bg: linear-gradient(135deg, rgba(6, 182, 212, 0.10) 0%, rgba(59, 130, 246, 0.12) 48%, rgba(79, 70, 229, 0.14) 100%);
      --ai-card-border: rgba(96, 165, 250, 0.18);
      --ai-inset-bg: rgba(255, 255, 255, 0.045);
      --ai-inset-border: rgba(96, 165, 250, 0.12);
      --ai-bullet-text: #a8a8a8;
      --ai-bullet-body: #898989;
      --favorite-star: #fbbf24;
      --note-accent: #f2b800;
      --gauge-marker-bg: #2f2f2f;
      --gauge-marker-border: rgba(255, 255, 255, 0.10);
      --gauge-marker-shadow: 0 2px 8px rgba(0, 0, 0, 0.32);
      --gauge-cold: #4f8cff;
      --gauge-cool: #60a5fa;
      --gauge-neutral: #f5c542;
      --gauge-warm: #ff8066;
      --gauge-hot: #ff5a66;
      --gauge-gradient: linear-gradient(90deg, var(--gauge-cold) 0%, #34d399 34%, var(--gauge-neutral) 66%, var(--gauge-hot) 100%);
      --signal-drawer-bg: #111111;
      --signal-card-bg: #1d1d1d;
      --signal-card-muted: #858585;
      --signal-filter-active-bg: #f2f2f2;
      --signal-filter-active-text: #111111;
      --signal-trigger-bg: rgba(242, 54, 69, 0.16);
      --signal-trigger-text: #ff6b75;
      --signal-clear-bg: rgba(31, 122, 255, 0.16);
      --signal-clear-text: #73a9ff;
      --signal-backfill-bg: #2a2a2a;
      --signal-backfill-text: #a7a7a7;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      --menu-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body.has-mover-ticker {
      padding-bottom: calc(34px + env(safe-area-inset-bottom));
    }

    .offline-banner {
      position: sticky;
      top: 0;
      z-index: 110;
      display: none;
      width: 100%;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--chart-down) 10%, var(--surface));
      color: var(--text);
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
    }

    body.offline-fallback .offline-banner {
      display: block;
    }

    body.theme-ready {
      transition: background-color 520ms ease, color 520ms ease;
    }

    body.theme-ready .sidebar,
    body.theme-ready .side-menu button,
    body.theme-ready .menu-item,
    body.theme-ready .mobile-menu-toggle,
    body.theme-ready .drawer-close,
    body.theme-ready .drawer-backdrop,
    body.theme-ready .settings-button,
    body.theme-ready .settings-menu,
    body.theme-ready .settings-menu button,
    body.theme-ready .reorder-actions button,
    body.theme-ready .currency-toggle,
    body.theme-ready .theme-toggle,
    body.theme-ready .scroll-top-button,
    body.theme-ready .mover-ticker,
    body.theme-ready .industry,
    body.theme-ready .industry-head,
    body.theme-ready .industry-icon-wrap,
    body.theme-ready .group,
    body.theme-ready .metric,
    body.theme-ready .metric-table-wrap,
    body.theme-ready .metric-table th,
    body.theme-ready .metric-table td,
    body.theme-ready .metric-toggle,
    body.theme-ready .metric-detail-panel,
    body.theme-ready .detail-stats,
    body.theme-ready .detail-stat,
    body.theme-ready .chart,
    body.theme-ready .empty {
      transition:
        background-color 520ms ease,
        border-color 520ms ease,
        box-shadow 520ms ease,
        color 520ms ease;
    }

    body.theme-ready .chart text,
    body.theme-ready .axis-line,
    body.theme-ready .guide,
    body.theme-ready .trend-line,
    body.theme-ready .current-dot {
      transition: fill 520ms ease, stroke 520ms ease;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      --shell-max-width: 1540px;
      --shell-padding-x: 24px;
      --shell-padding-top: 22px;
      --sidebar-width: 232px;
      --shell-gap: 26px;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      gap: var(--shell-gap);
      width: min(var(--shell-max-width), 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: var(--shell-padding-top) var(--shell-padding-x) 42px;
    }

    .sidebar {
      position: fixed;
      top: var(--shell-padding-top);
      left: max(var(--shell-padding-x), calc((100vw - var(--shell-max-width)) / 2 + var(--shell-padding-x)));
      z-index: 40;
      min-width: 0;
      width: var(--sidebar-width);
      height: calc(100dvh - (var(--shell-padding-top) * 2));
      max-height: calc(100dvh - (var(--shell-padding-top) * 2));
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      gap: 12px;
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: var(--sidebar);
      box-shadow: var(--menu-shadow);
      overflow: visible;
    }

    .side-menu {
      display: grid;
      gap: 7px;
      min-width: 0;
      max-width: 100%;
      min-height: 0;
      align-content: start;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      user-select: none;
    }

    .side-menu::-webkit-scrollbar {
      display: none;
    }

    .side-menu.is-drag-scrolling {
      cursor: grabbing;
    }

    .side-menu.is-drag-scrolling * {
      cursor: grabbing !important;
    }

    .menu-item {
      position: relative;
      min-width: 0;
      border-radius: 24px;
    }

    .side-menu button {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      padding: 0 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 720;
      cursor: pointer;
    }

    .sidebar.is-reordering .side-menu button {
      padding-right: 36px;
      cursor: grab;
    }

    .side-menu button:hover {
      background: var(--menu);
    }

    .side-menu button[aria-pressed="true"] {
      color: var(--text);
    }

    .side-menu button[aria-current="true"] {
      background: var(--menu-active);
      color: var(--text);
    }

    .menu-depth-list {
      display: grid;
      gap: 3px;
      margin: 4px 0 6px 6px;
      padding-left: 4px;
    }

    .menu-depth-item {
      min-width: 0;
    }

    .side-menu .menu-depth-button {
      min-height: 31px;
      border-radius: 10px;
      padding: 0 10px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }

    .side-menu .menu-depth-button[aria-current="true"] {
      color: var(--text);
      background: var(--menu-active);
    }

    .sidebar.is-reordering .menu-depth-list {
      display: none;
    }

    .drawer-head,
    .mobile-menu-toggle,
    .drawer-backdrop {
      display: none;
    }

    .drawer-close,
    .mobile-menu-toggle {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      display: none;
      place-items: center;
      background: var(--menu);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      box-shadow: var(--menu-shadow);
    }

    .drawer-close:hover,
    .mobile-menu-toggle:hover {
      background: var(--menu-active);
    }

    .drawer-close:focus-visible,
    .mobile-menu-toggle:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .drag-handle {
      position: absolute;
      right: 10px;
      top: 19px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 180ms ease;
    }

    .sidebar.is-reordering .drag-handle {
      opacity: 1;
      pointer-events: auto;
      cursor: grab;
    }

    .menu-item.is-dragging {
      opacity: 0.45;
    }

    .menu-settings {
      position: relative;
      display: grid;
      gap: 8px;
    }

    .settings-button,
    .settings-menu button,
    .reorder-actions button {
      min-width: 0;
      border: 0;
      cursor: pointer;
    }

    .settings-button {
      min-height: 40px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 14px;
      gap: 8px;
      align-items: center;
      padding: 0 12px;
      background: var(--menu);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      text-align: left;
    }

    .settings-button:hover,
    .settings-button[aria-expanded="true"] {
      background: var(--menu-active);
    }

    .settings-chevron {
      color: var(--muted);
      font-size: 11px;
      transition: transform 180ms ease;
    }

    .settings-button[aria-expanded="true"] .settings-chevron {
      transform: rotate(180deg);
    }

    .settings-menu {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 8px);
      z-index: 20;
      display: grid;
      gap: 5px;
      padding: 7px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--menu-shadow);
    }

    .settings-menu[hidden],
    .reorder-actions[hidden] {
      display: none;
    }

    .settings-menu button {
      min-height: 36px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 18px max-content minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 0 9px;
      background: transparent;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 400;
      text-align: left;
    }

    .settings-menu button > span:not(.settings-meta) {
      min-width: max-content;
      white-space: nowrap;
    }

    .settings-menu button:hover {
      background: var(--menu);
    }

    .settings-meta {
      min-width: max-content;
      justify-self: end;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .reorder-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .reorder-actions button {
      min-height: 38px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 780;
    }

    .reorder-cancel {
      background: var(--menu);
      color: var(--text);
    }

    .reorder-save {
      background: var(--chart-down);
      color: #ffffff;
    }

    .content {
      grid-column: 2;
      min-width: 0;
      display: grid;
      gap: 20px;
      align-content: start;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 46px;
    }

    .title-wrap {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .search-toggle,
    .history-toggle {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--menu);
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      box-shadow: var(--menu-shadow);
    }

    .search-toggle:hover,
    .history-toggle:hover,
    .search-toggle[aria-pressed="true"],
    .history-toggle[aria-expanded="true"] {
      background: var(--menu-active);
    }

    .history-toggle {
      position: relative;
    }

    .history-dot {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--negative);
    }

    .signal-drawer,
    .signal-drawer-backdrop {
      display: none;
    }

    .signal-drawer {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 90;
      width: min(390px, 88vw);
      transform: translateX(102%);
      transition: transform 180ms ease;
      background: var(--signal-drawer-bg);
      border-left: 0;
      box-shadow: -18px 0 45px rgba(0, 0, 0, 0.12);
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    .signal-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .signal-drawer-body {
      display: grid;
      gap: 12px;
    }

    .signal-drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 89;
      background: rgba(0, 0, 0, 0.18);
    }

    body.signal-drawer-open .signal-drawer,
    body.signal-drawer-open .signal-drawer-backdrop {
      display: block;
    }

    body.signal-drawer-open .signal-drawer {
      transform: translateX(0);
    }

    .signal-section {
      display: grid;
      gap: 12px;
    }

    .signal-section-title {
      color: color-mix(in srgb, var(--text) 72%, var(--signal-card-muted));
      font-size: 13px;
      font-weight: 650;
    }

    .signal-filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 0 2px;
    }

    .signal-filter-chip {
      flex: 0 0 auto;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--chip-radius);
      background: var(--signal-card-bg);
      color: var(--text);
      padding: 0 15px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .signal-filter-chip[aria-pressed="true"] {
      border-color: var(--signal-filter-active-bg);
      background: var(--signal-filter-active-bg);
      color: var(--signal-filter-active-text);
    }

    .signal-card {
      display: grid;
      gap: 8px;
      border: 0;
      border-radius: 18px;
      background: var(--signal-card-bg);
      padding: 16px;
      box-shadow: 0 1px 0 rgba(17, 24, 39, 0.02);
    }

    .signal-card.is-triggered {
      color: var(--text);
    }

    .signal-card.is-backfilled {
      opacity: 1;
    }

    .signal-card + .signal-card {
      border-top: 0;
    }

    .signal-card-top {
      min-width: 0;
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .signal-card-badges {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .signal-status-badge,
    .signal-backfill-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 20px;
      padding: 0 7px;
      border-radius: var(--chip-radius);
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .signal-status-badge.is-triggered {
      background: var(--signal-trigger-bg);
      color: var(--signal-trigger-text);
    }

    .signal-status-badge.is-cleared {
      background: var(--signal-clear-bg);
      color: var(--signal-clear-text);
    }

    .signal-backfill-badge {
      background: var(--signal-backfill-bg);
      color: var(--signal-backfill-text);
      font-weight: 650;
    }

    .signal-card-time {
      flex: 0 0 auto;
      color: var(--signal-card-muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .signal-card-title {
      width: fit-content;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      text-align: left;
      font: inherit;
      font-size: 14px;
      font-weight: 760;
      line-height: 1.35;
      cursor: pointer;
    }

    .signal-card-title:hover {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .signal-card-value-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .signal-card-value {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px;
      color: var(--text);
    }

    .signal-card-value-main {
      font-size: 21px;
      line-height: 1.05;
      font-weight: 820;
      letter-spacing: 0;
    }

    .signal-card-threshold {
      color: var(--signal-card-muted);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
    }

    .signal-card-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 650;
    }

    .signal-card-change.positive {
      color: var(--signal-trigger-text);
    }

    .signal-card-change.negative {
      color: var(--chart-down);
    }

    .signal-card-change i {
      font-size: 11px;
      line-height: 1;
    }

    .signal-card p {
      margin: 0;
      color: var(--signal-card-muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .signal-card-context {
      margin-top: -3px;
    }

    .metric-search-host {
      position: sticky;
      top: 0;
      z-index: 35;
      margin: 0 0 14px;
      padding: 8px 0;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
    }

    .metric-search-host[hidden] {
      display: none;
    }

    .metric-search-box {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 8px 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric-search-box i {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .metric-search-input {
      min-width: 0;
      height: 42px;
      border: 0;

      height: var(--depth-corner-height);

      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 119;
      background: rgba(18, 18, 18, 0.38);
    }

    .note-modal {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 120;
      width: min(405px, 100vw);
      max-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0;
      background: var(--panel);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.18);
    }

    .note-modal[hidden],
    .note-modal-backdrop[hidden] {
      display: none;
    }

    .note-modal-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 10px 14px;
    }

    .note-modal-title {
      min-width: 0;
      display: grid;
      gap: 12px;
      padding-top: 1px;
    }

    .note-modal-title strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 21px;
      line-height: 1.05;
      font-weight: 700;
    }

    .note-modal-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .note-modal-close {
      width: 20px;
      height: 24px;
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 17px;
      padding: 0;
    }

    .note-editor {
      padding: 4px 10px 22px;
    }

    .note-editor-box {
      min-height: 142px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 12px 12px 12px 16px;
    }

    .note-textarea {
      width: 100%;
      min-height: 76px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
    }

    .note-textarea::placeholder {
      color: var(--muted);
      opacity: 0.72;
    }

    .note-editor-foot {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .note-char-count {
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    .note-modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .note-action-button {
      min-height: 32px;
      border: 0;
      border-radius: 16px;
      background: var(--menu);
      color: var(--muted);
      padding: 0 17px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .note-action-button.primary {
      background: var(--menu);
      color: var(--muted);
    }

    .note-action-button:disabled {
      cursor: default;
      opacity: 0.58;
    }

    .note-action-button.primary:not(:disabled) {
      background: color-mix(in srgb, var(--chart-down) 12%, var(--menu));
      color: var(--chart-down);
    }

    .note-history-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-top: 1px solid var(--line);
      padding: 14px 0 0;
    }

    .note-history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 10px 12px;
    }

    .note-history-head strong {
      font-size: 14px;
      font-weight: 600;
    }

    .note-history-count {
      min-width: 26px;
      min-height: 18px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--menu);
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      padding: 0 8px;
    }

    .note-history-count:empty {
      display: none;
    }

    .note-history-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 0;
      scrollbar-width: none;
    }

    .note-history-list::-webkit-scrollbar {
      display: none;
    }

    .note-history-empty {
      margin: 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .note-history-item {
      display: grid;
      gap: 12px;
      padding: 15px 10px 16px;
      border-top: 1px solid var(--line);
      background: transparent;
    }

    .note-history-item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .note-history-time {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .note-history-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .note-history-action {
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
      font-size: 12px;
      cursor: pointer;
    }

    .note-history-action:hover,
    .note-history-action:focus-visible {
      color: var(--text);
      background: transparent;
    }

    .note-history-text {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .compare-mode-button.is-active,
    .compare-range-button.is-active {
      background: var(--panel);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
    }

    .compare-mode-button:disabled,
    .compare-range-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .compare-panel {
      display: grid;
      gap: 12px;
      margin: 2px 0 10px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .compare-settings {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 28px;
    }

    .compare-setting-group {
      display: grid;
      gap: 7px;
    }

    .compare-setting-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      font-weight: 400;
    }

    .compare-segmented {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 16px;
      background: var(--menu);
    }

    .compare-mode-button,
    .compare-range-button {
      min-height: 30px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      padding: 0 13px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .compare-search-box {
      display: grid;
      gap: 7px;
    }

    .compare-search-row {
      min-height: 48px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 0 8px 0 14px;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .compare-search-icon {
      color: var(--muted);
      font-size: 13px;
    }

    .compare-search-input {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      font: inherit;
      font-size: 13px;
      font-weight: 400;
      outline: none;
    }

    .compare-search-input::placeholder {
      color: var(--muted);
    }

    .compare-add-button {
      min-height: 32px;
      border: 0;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2563eb;
      color: #fff;
      padding: 0 15px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .compare-add-button:hover,
    .compare-add-button:focus-visible {
      background: #1d4ed8;
      outline: none;
    }

    .compare-results,
    .compare-recent {
      display: grid;
      gap: 2px;
      max-height: 132px;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 0 4px;
    }

    .compare-results:empty,
    .compare-recent:empty {
      display: none;
    }

    .compare-results::-webkit-scrollbar,
    .compare-recent::-webkit-scrollbar {
      display: none;
    }

    .compare-result-button {
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      padding: 6px 8px;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .compare-result-button:hover {
      background: transparent;
      color: var(--text);
    }

    .compare-legend,
    .compare-selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-top: -2px;
      padding-top: 2px;
    }

    .compare-selected-list {
      margin-top: 0;
      padding-top: 0;
      gap: 7px;
    }

    .compare-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.2;
      cursor: default;
    }

    .compare-selected-list .compare-chip {
      min-height: 28px;
      border-radius: 999px;
      background: var(--menu);
      padding: 0 9px;
      color: var(--text);
    }

    .compare-swatch {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--compare-color, var(--chart-down));
    }

    .compare-chip-remove {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    .compare-chip-remove:hover,
    .compare-chip-remove:focus-visible {
      background: var(--menu-active);
      color: var(--text);
      outline: none;
    }

    .compare-warning {
      width: 100%;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .compare-chart .compare-warning {
      grid-column: 1 / -1;
    }

    .compare-chart-stack {
      display: grid;
      gap: 6px;
    }

    .compare-chart .compare-line-0 { stroke: var(--chart-down); }
    .compare-chart .compare-line-1 { stroke: #16a34a; }
    .compare-chart .compare-line-2 { stroke: #8b5cf6; }
    .compare-chart .compare-line-3 { stroke: #f59e0b; }

    .compare-line {
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .compare-point-hit {
      cursor: crosshair;
    }

    .signal-marker-line {
      stroke: var(--negative);
      stroke-width: 1.2;
      stroke-dasharray: 3 3;
      opacity: 0.72;
    }

    .signal-marker-triangle {
      fill: var(--negative);
      opacity: 0.9;
    }

    .chart-band-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: color 160ms ease;
    }

    .chart-band-toggle:hover {
      color: var(--text);
    }

    .chart-band-swatch {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.2);
    }

    body.theme-dark .chart-band-swatch {
      background: rgba(96, 165, 250, 0.22);
    }

    .chart-band-switch {
      position: relative;
      width: 34px;
      height: 20px;
      flex: 0 0 34px;
      border-radius: 999px;
      background: #2563eb;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
      transition: background 160ms ease;
    }

    .chart-band-switch::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.22);
      transform: translateX(14px);
      transition: transform 160ms ease;
    }

    .chart-band-toggle[aria-pressed="false"] {
      color: var(--muted);
    }

    .chart-band-toggle[aria-pressed="false"] .chart-band-swatch {
      opacity: 0.42;
    }

    .chart-band-toggle[aria-pressed="false"] .chart-band-switch {
      background: #cbd5e1;
    }

    body.theme-dark .chart-band-toggle[aria-pressed="false"] .chart-band-switch {
      background: #475569;
    }

    .chart-band-toggle[aria-pressed="false"] .chart-band-switch::after {
      transform: translateX(0);
    }

    .chart-band-legend-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-chart.is-band-hidden .pct-band,
    .detail-chart.is-band-hidden .pct-band-median {
      display: none;
    }

    .detail-chart-tooltip {
      position: absolute;
      z-index: 5;
      left: 0;
      top: 0;
      width: min(220px, calc(100vw - 44px));
      padding: 9px 10px;
      border-radius: 12px;
      background: var(--text);
      color: var(--surface);
      box-shadow: var(--menu-shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .detail-chart-tooltip.is-visible {
      opacity: 1;
      transform: translate(-50%, 8px);
    }

    .detail-tooltip-title {
      margin-bottom: 6px;
      color: inherit;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .detail-tooltip-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      align-items: baseline;
      font-size: 11px;
      line-height: 1.35;
    }

    .detail-tooltip-label {
      color: color-mix(in srgb, currentColor 62%, transparent);
    }

    .detail-tooltip-value {
      min-width: 0;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-height: 348px;
      display: grid;
      grid-template-rows: auto auto 158px;
      gap: 13px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .metric h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.32;
      font-weight: 790;
      overflow-wrap: anywhere;
    }

    .meaning {
      margin: 7px 0 0;
      min-height: 38px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .metric-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
    }

    .value {
      font-size: 31px;
      line-height: 1;
      font-weight: 820;
      overflow-wrap: anywhere;
    }

    .deltas {
      display: grid;
      gap: 5px;
      min-width: 92px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .deltas strong {
      display: inline-block;
      min-width: 54px;
      color: var(--text);
      font-size: 13px;
    }

    .positive { color: var(--chart-up) !important; }
    .negative { color: var(--chart-down) !important; }

    .chart {
      width: 100%;
      height: 158px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: visible;
    }

    .chart.chart-mini,
    .chart.detail-chart-axis,
    .detail-chart-scroll .chart.chart-detail {
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .chart text {
      fill: var(--muted);
      font-size: 10.5px;
      font-weight: 400;
    }

    .chart text.level-max {
      fill: var(--chart-down);
    }

    .chart text.level-min {
      fill: var(--chart-up);
    }

    .chart text.level-current {
      fill: var(--text);
    }

    .axis-line {
      stroke: var(--line);
      stroke-width: 1;
    }

    .guide {
      stroke: var(--line);
      stroke-width: 0.7;
      stroke-dasharray: 4 4;
    }

    .chart-background-line {
      stroke: var(--line);
      stroke-width: 0.55;
      stroke-dasharray: 3 5;
      opacity: 0.44;
    }

    .chart-background-line.level-line {
      opacity: 0.92;
      stroke-width: 0.7;
      stroke-dasharray: 4 5;
    }

    .chart-background-line.level-max {
      stroke: var(--chart-down);
    }

    .chart-background-line.level-min {
      stroke: var(--chart-up);
    }

    .chart-background-line.level-current {
      stroke: var(--text);
      stroke-width: 1.5;
    }

    .trend-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trend-line.up { stroke: var(--chart-up); }
    .trend-line.down { stroke: var(--chart-down); }

    .flow-bar.positive { fill: var(--chart-up); opacity: 0.72; }
    .flow-bar.negative { fill: var(--chart-down); opacity: 0.72; }
    .flow-cumulative-line {
      fill: none;
      stroke: var(--text);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.86;
    }

    .current-dot.up { fill: var(--chart-up); }
    .current-dot.down { fill: var(--chart-down); }

    .detail-point-hit {
      cursor: crosshair;
      pointer-events: all;
    }

    .empty {
      display: none;
      margin: 28px 0;
      padding: 26px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1180px) {
      .shell {
        --shell-padding-x: 18px;
        --sidebar-width: 190px;
        --shell-gap: 18px;
      }

      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      body {
        font-size: 15px;
      }

      .shell {
        --shell-padding-x: 10px;
        --shell-padding-top: 14px;
        --sidebar-width: 0px;
        --shell-gap: 14px;
        grid-template-columns: 1fr;
        padding: 14px 10px 30px;
      }

      .content {
        grid-column: 1;
      }

      body.drawer-open {
        overflow: hidden;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 70;
        width: min(320px, calc(100vw - 54px));
        max-width: calc(100vw - 54px);
        height: 100dvh;
        max-height: 100dvh;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        padding: 14px;
        border-radius: 0 20px 20px 0;
        overflow: visible;
        transform: translateX(calc(-100% - 24px));
        transition: transform 260ms ease;
      }

      body.drawer-open .sidebar {
        transform: translateX(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        padding: 2px 0 4px;
        font-size: 15px;
        font-weight: 820;
      }

      .drawer-close,
      .mobile-menu-toggle {
        display: grid;
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        border: 1px solid var(--line);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: block;
        background: rgba(18, 18, 18, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .drawer-backdrop[hidden] {
        display: none;
      }

      body.drawer-open .drawer-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      .side-menu {
        display: grid;
        gap: 7px;
        max-width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 0 2px 0 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .side-menu button {
        width: 100%;
        white-space: normal;
      }

      .sidebar.is-reordering .side-menu button {
        padding-right: 34px;
      }

      .settings-menu {
        position: static;
        order: -1;
      }

      .reorder-actions {
        grid-template-columns: 1fr 1fr;
      }

      .topbar {
        position: relative;
        z-index: 1;
        display: block;
        min-height: 90px;
        margin: 0;
        padding: 56px 0 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .mobile-menu-toggle {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        top: max(10px, env(safe-area-inset-top));
        z-index: 58;
      }

      .topbar-actions {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        top: max(10px, env(safe-area-inset-top));
        z-index: 58;
        gap: 7px;
      }

      .search-toggle,
      .history-toggle {
        width: 46px;
        height: 46px;
      }

      .floating-search-button {
        display: none;
      }

      .metric-search-host {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));

      padding: 0;
