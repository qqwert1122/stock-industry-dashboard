<svg xmlns="http://www.w3.org/2000/svg" width="260" height="128" viewBox="0 0 260 128" role="img" aria-labelledby="title desc">
  <title id="title">Market Brief logo</title>
  <desc id="desc">A stacked MARKET BRIEF wordmark with a short horizontal rule before BRIEF.</desc>
  <g fill="#111111" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
    <text
      x="32"
      y="52"
      font-size="37"
      font-weight="900"
      letter-spacing="5.8"
      paint-order="stroke fill"
      stroke="#111111"
      stroke-width="0.65">MARKET</text>
    <rect x="34" y="82" width="36" height="2" rx="1"/>
    <text x="84" y="101" font-size="37" font-weight="400" letter-spacing="6.2">BRIEF</text>
  </g>
</svg>
