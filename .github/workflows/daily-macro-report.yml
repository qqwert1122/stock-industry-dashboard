name: Daily Industry Dashboard

on:
  schedule:
    # 23:00 UTC = 08:00 KST
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-industry-dashboard-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch previous dashboard data
        run: |
          mkdir -p site/data
          curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/dashboard.json \
            -o site/data/dashboard.json || true

      - name: Build dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: industry-dashboard --config config.yaml --out site

      - name: Deploy to public Pages repository
        env:
          USER_PAGES_DEPLOY_KEY: ${{ secrets.USER_PAGES_DEPLOY_KEY }}
        run: |
          test -n "$USER_PAGES_DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$USER_PAGES_DEPLOY_KEY" > ~/.ssh/user_pages_key
          chmod 600 ~/.ssh/user_pages_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/user_pages_key
            IdentitiesOnly yes
          EOF

          git clone git@github.com:qqwert1122/qqwert1122.github.io.git public-pages
          mkdir -p public-pages/stock-industry-dashboard
          rsync -a --delete site/ public-pages/stock-industry-dashboard/
          cd public-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-industry-dashboard
          if git diff --cached --quiet; then
            echo "No dashboard changes to deploy."
          else
            git commit -m "Update stock industry dashboard"
            git push origin main
          fi
