name: Daily Industry Dashboard

on:
  schedule:
    # 23:00 UTC = 08:00 KST
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-industry-dashboard-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Restore previous dashboard data
        run: |
          mkdir -p site/data
          # KRX flow raw snapshots live under data/history/krx-flow-raw-*.json.
          # They are restored by actions/checkout and committed by `git add data` below.
          mkdir -p data/history
          if [ -f data/last_dashboard.json ]; then
            cp data/last_dashboard.json site/data/dashboard.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/dashboard.json \
              -o site/data/dashboard.json || true
          fi
          if [ -f data/market_gauges_history.json ]; then
            cp data/market_gauges_history.json site/data/market_gauges_history.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/market_gauges_history.json \
              -o site/data/market_gauges_history.json || true
          fi
          if [ -f data/fetch_log_history.json ]; then
            cp data/fetch_log_history.json site/data/fetch_log_history.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/fetch_log_history.json \
              -o site/data/fetch_log_history.json || true
          fi
          if [ -f data/signal_log.json ]; then
            cp data/signal_log.json site/data/signal_log.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/signal_log.json \
              -o site/data/signal_log.json || true
          fi
          if [ -f data/calendar.json ]; then
            cp data/calendar.json site/data/calendar.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/calendar.json \
              -o site/data/calendar.json || true
          fi
          if [ -f data/intraday_track.json ]; then
            cp data/intraday_track.json site/data/intraday_track.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/intraday_track.json \
              -o site/data/intraday_track.json || true
          fi
          if [ -d data/briefings ]; then
            mkdir -p site/data/briefings
            cp -R data/briefings/. site/data/briefings/
          fi
          curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/analytics.json \
            -o site/data/analytics.json || true

      - name: Build dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: industry-dashboard --config config.yaml --out site

      - name: Refresh Admin analytics snapshot
        if: ${{ vars.GA_PROPERTY_ID != '' && secrets.GA_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: python scripts/refresh_analytics.py --out site/data/analytics.json

      - name: Commit data cache back to repository
        run: |
          mkdir -p data
          cp site/data/dashboard.json data/last_dashboard.json
          if [ -f site/data/market_gauges_history.json ]; then
            cp site/data/market_gauges_history.json data/market_gauges_history.json
          fi
          if [ -f site/data/fetch_log_history.json ]; then
            cp site/data/fetch_log_history.json data/fetch_log_history.json
          fi
          if [ -f site/data/signal_log.json ]; then
            cp site/data/signal_log.json data/signal_log.json
          fi
          if [ -f site/data/calendar.json ]; then
            cp site/data/calendar.json data/calendar.json
          fi
          if [ -f site/data/intraday_track.json ]; then
            cp site/data/intraday_track.json data/intraday_track.json
          fi
          if [ -d site/data/briefings ]; then
            rm -rf data/briefings
            mkdir -p data
            cp -R site/data/briefings data/briefings
          fi
          # Includes data/history/krx-flow-raw-*.json produced during incremental KRX flow backfill.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data cache changes."
          else
            git commit -m "Update data cache [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Deploy to public Pages repository
        env:
          USER_PAGES_DEPLOY_KEY: ${{ secrets.USER_PAGES_DEPLOY_KEY }}
        run: |
          test -n "$USER_PAGES_DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$USER_PAGES_DEPLOY_KEY" > ~/.ssh/user_pages_key
          chmod 600 ~/.ssh/user_pages_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/user_pages_key
            IdentitiesOnly yes
          EOF

          git clone git@github.com:qqwert1122/qqwert1122.github.io.git public-pages
          mkdir -p public-pages/stock-industry-dashboard
          rsync -a --delete site/ public-pages/stock-industry-dashboard/
          cd public-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-industry-dashboard
          if git diff --cached --quiet; then
            echo "No dashboard changes to deploy."
          else
            git commit -m "Update stock industry dashboard"
            git push origin main
          fi

      - name: Notify failure via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🛑 일일 대시보드 빌드 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
