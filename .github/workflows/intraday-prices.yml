name: Intraday Price Refresh

on:
  schedule:
    # 00:30-14:30 UTC 2시간 간격, 평일 = 09:30-23:30 KST
    # 한국장(09:00-15:30)과 미국장 개장 초반(23:30 KST)까지 커버합니다.
    - cron: "30 0-14/2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-industry-dashboard-pages
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore previous dashboard data
        run: |
          mkdir -p site/data
          if [ -f data/last_dashboard.json ]; then
            cp data/last_dashboard.json site/data/dashboard.json
          else
            curl -fsSL https://qqwert1122.github.io/stock-industry-dashboard/data/dashboard.json \
              -o site/data/dashboard.json || true
          fi

      - name: Refresh price metrics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: industry-dashboard --config config.yaml --out site --prices-only

      - name: Commit data cache back to repository
        run: |
          mkdir -p data
          cp site/data/dashboard.json data/last_dashboard.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data cache changes."
          else
            git commit -m "Update intraday price cache [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Deploy to public Pages repository
        env:
          USER_PAGES_DEPLOY_KEY: ${{ secrets.USER_PAGES_DEPLOY_KEY }}
        run: |
          test -n "$USER_PAGES_DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$USER_PAGES_DEPLOY_KEY" > ~/.ssh/user_pages_key
          chmod 600 ~/.ssh/user_pages_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/user_pages_key
            IdentitiesOnly yes
          EOF

          git clone git@github.com:qqwert1122/qqwert1122.github.io.git public-pages
          mkdir -p public-pages/stock-industry-dashboard
          rsync -a --delete site/ public-pages/stock-industry-dashboard/
          cd public-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-industry-dashboard
          if git diff --cached --quiet; then
            echo "No dashboard changes to deploy."
          else
            git commit -m "Refresh intraday prices"
            git push origin main
          fi
